name: Deploy source fix once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy source fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy source-worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy source-worker --project-ref dpmohkrwdlicexwcrqfy --no-verify-jwt
