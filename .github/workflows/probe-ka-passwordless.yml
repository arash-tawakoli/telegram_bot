name: Probe Kleinanzeigen passwordless capability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-ka-passwordless.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe passwordless start with non-existent address
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pwless.json -w '%{http_code}' \
            -X POST 'https://login.kleinanzeigen.de/passwordless/start' \
            -H 'Content-Type: application/json' \
            --data '{"client_id":"uV5j90myVPc2XzEOFuWUD2At17OACEGQ","connection":"email","email":"nonexistent-probe@example.invalid","send":"code"}')"
          echo "http_status=$code"
          jq -c '{error:(.error // null), error_description:(.error_description // null), message:(.message // null)}' /tmp/pwless.json || cat /tmp/pwless.json