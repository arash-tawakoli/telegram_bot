name: Probe Kleinanzeigen web-message OAuth

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-kleinanzeigen-device-flow.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe web-message response mode
        shell: bash
        run: |
          set -euo pipefail
          CLIENT='uV5j90myVPc2XzEOFuWUD2At17OACEGQ'
          ORIG='https://login.kleinanzeigen.de/android/com.ebay.kleinanzeigen/callback'
          OURS='https://intern.traumwohnunghamburg.de/ka-callback'
          CHALLENGE='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'

          run_probe() {
            name="$1"
            redirect="$2"
            extra="$3"
            enc_redirect="$(jq -rn --arg v "$redirect" '$v|@uri')"
            url="https://login.kleinanzeigen.de/authorize?client_id=$CLIENT&response_type=code&redirect_uri=$enc_redirect&scope=openid%20email%20profile%20offline_access&code_challenge=$CHALLENGE&code_challenge_method=S256&state=teststate&prompt=none&response_mode=web_message$extra"
            code="$(curl -sS -L -o "/tmp/$name.html" -w '%{http_code}' "$url")"
            echo "$name http_status=$code bytes=$(wc -c < "/tmp/$name.html")"
            if grep -qi 'postMessage' "/tmp/$name.html"; then echo "$name post_message=true"; else echo "$name post_message=false"; fi
            if grep -Eqi 'invalid redirect|redirect_uri.*(not allowed|mismatch)' "/tmp/$name.html"; then echo "$name invalid_redirect=true"; else echo "$name invalid_redirect=false"; fi
            if grep -qi 'login_required' "/tmp/$name.html"; then echo "$name login_required=true"; else echo "$name login_required=false"; fi
            grep -Eo 'https://[A-Za-z0-9._-]+' "/tmp/$name.html" | sort -u | head -20 | sed "s/^/$name origin=/" || true
          }

          run_probe original "$ORIG" ''
          run_probe ours "$OURS" ''
          WM_URI="$(jq -rn --arg v 'https://intern.traumwohnunghamburg.de' '$v|@uri')"
          run_probe original_with_web_message_uri "$ORIG" "&web_message_uri=$WM_URI"
