name: UX category read-only fixtures
on:
  push:
    branches: ['ux/onboarding-category-speed-20260920']
    paths: ['.github/workflows/ux-provider-probes.yml']
permissions:
  contents: read
jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read house inventory contract
        run: |
          mkdir -p fixtures-out
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const endpoint='https://app.chatgpt.immobilienscout24.de/v2/mcp';
          const call=async(method,params)=>{
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream','mcp-protocol-version':'2025-06-18'},body:JSON.stringify({jsonrpc:'2.0',...(method.startsWith('notifications/')?{}:{id:crypto.randomUUID()}),method,...(params?{params}:{})}),signal:AbortSignal.timeout(18000)});
            const text=await r.text(); if(!r.ok)throw Error(`HTTP ${r.status}`); let j;for(const line of text.split('\n'))try{j=JSON.parse(line.startsWith('data:')?line.slice(5):line)}catch{};if(j?.error||j?.result?.isError)throw Error('MCP contract error');return j?.result?.structuredContent||j?.result?.structured_content||{};
          };
          await call('initialize',{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'traumwohnung-hamburg',version:'14.0.0'}});await call('notifications/initialized');
          const data=await call('tools/call',{name:'property_map_de',arguments:{query:'Häuser zur Miete in Hamburg, neueste Inserate'}});
          const entries=data.entries||[],ids=[...new Set(entries.map(x=>String(x.exposedId||x.exposeId||x.id||'')))];
          const reduced={at:new Date().toISOString(),total:data.total,returned:entries.length,unique:ids.length,keys:Object.keys(data),entries:entries.map(({exposedId,exposeId,id,title,rooms,size,price,address,realEstateType,totalRent})=>({exposedId,exposeId,id,title,rooms,size,price,address,realEstateType,totalRent}))};
          await writeFile('fixtures-out/scout-house.json',JSON.stringify(reduced,null,2));console.log(JSON.stringify({total:data.total,returned:entries.length,unique:ids.length,keys:Object.keys(data)}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: ux-scout-house-fixture
          path: fixtures-out/
          retention-days: 2
