name: Export Stripe webhook once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-stripe-webhook-once.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify export target
        run: |
          set -euo pipefail
          test -s supabase/functions/stripe-webhook/index.ts
          grep -q 'customer.subscription.updated' supabase/functions/stripe-webhook/index.ts
          grep -q 'invoice.payment_failed' supabase/functions/stripe-webhook/index.ts
          if grep -q 'eventType === "invoice.paid"' supabase/functions/stripe-webhook/index.ts; then
            echo 'obsolete invoice.paid referral branch detected' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stripe-webhook-source
          path: supabase/functions/stripe-webhook/index.ts
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-shot export workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-stripe-webhook-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/export-stripe-webhook-once.yml
          git commit -m "Remove one-shot Stripe webhook export"
          git push origin HEAD:main
