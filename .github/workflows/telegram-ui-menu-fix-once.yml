name: Telegram UI menu fix once
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/telegram-ui-menu-fix-once.yml'
permissions:
  contents: write
jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Patch UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/telegram-ui/index.ts')
          s=p.read_text()
          settings_start=s.index('async function settings(')
          settings_end=s.index('async function handleMessage(', settings_start)
          part=s[settings_start:settings_end]
          part=part.replace('    [button("⏸ Suche pausieren", "pause"), button("▶️ Suche fortsetzen", "resume")],\n','')
          s=s[:settings_start]+part+s[settings_end:]
          old='''    [
      button("📡 Status", "status"),
      button("❓ Hilfe", "help"),
    ],'''
          if old not in s: raise SystemExit('home anchor missing')
          s=s.replace(old,'    [button("❓ Hilfe", "help")],',1)
          a=s.index('async function saved('); b=s.index('async function renderStatus(',a)
          block='''async function saved(user: any, chatId: number, messageId?: number, requestedIndex = 0) {
  if (!user.is_premium) return premium(user, chatId, messageId);
  const { data, error } = await db.from("saved_listings").select("listing_id,created_at,listings(title,canonical_url,is_active,sources(name,button_label))").eq("user_id", user.id).order("created_at", { ascending: false });
  if (error) throw error;
  const items = (data || []).filter((row: any) => row.listings);
  if (!items.length) {
    const text = "⭐️ <b>Gespeicherte Inserate</b>\\n\\nNoch keine Inserate gespeichert.";
    const markup = { inline_keyboard: [[button("← Zurück", "home")]] };
    return messageId ? edit(chatId, messageId, text, markup) : send(chatId, text, markup);
  }
  const index = Math.max(0, Math.min(items.length - 1, Number(requestedIndex) || 0));
  const listing: any = items[index].listings;
  const source: any = listing.sources || {};
  const title = esc(String(listing.title || "Inserat").replace(/\\s+/g, " ").slice(0, 180));
  const rows: any[] = [];
  try { const url = new URL(listing.canonical_url); if (["http:", "https:"].includes(url.protocol)) rows.push([{ text: `🔗 ${source.button_label || source.name || "Angebot"}`, url: url.href }]); } catch {}
  const nav: any[] = [];
  if (index > 0) nav.push(button("⬅️ Zurück", `saved:${index - 1}`));
  if (index < items.length - 1) nav.push(button("Weiter ➡️", `saved:${index + 1}`));
  if (nav.length) rows.push(nav);
  rows.push([button("← Start", "home")]);
  const text = `⭐️ <b>Gespeicherte Inserate</b>\\n\\n<b>${title}</b>\\n\\n${index + 1}/${items.length}`;
  return messageId ? edit(chatId, messageId, text, { inline_keyboard: rows }) : send(chatId, text, { inline_keyboard: rows });
}

'''
          s=s[:a]+block+s[b:]
          old='      [button(current.is_active ? "⏸ Pausieren" : "▶️ Fortsetzen", current.is_active ? `profile:pause:${selectedSlot}` : `profile:resume:${selectedSlot}`)],\n      [button("← Zurück", "profile")],'
          if old not in s: raise SystemExit('profile anchor missing')
          s=s.replace(old,'      [button(current.is_active ? "⏸ Pausieren" : "▶️ Fortsetzen", current.is_active ? `profile:pause:${selectedSlot}` : `profile:resume:${selectedSlot}`)],\n      [button("🗑 Profil löschen", `profile:delete:${selectedSlot}`)],\n      [button("← Zurück", "profile")],',1)
          anchor='  if (data === "profile" || data === "profiles") return profile(user, chatId, messageId);\n'
          s=s.replace(anchor,'  if (data.startsWith("saved:")) return saved(user, chatId, messageId, Number(data.split(":")[1]) || 0);\n'+anchor,1)
          anchor='  if (data.startsWith("profile:pause:") || data.startsWith("profile:resume:")) {\n'
          add='''  if (data.startsWith("profile:delete-confirm:")) {
    const slot = Number(data.split(":")[2]);
    if (!slot) return;
    const { error } = await db.from("search_profiles").delete().eq("user_id", user.id).eq("profile_slot", slot);
    if (error) throw error;
    return profile(user, chatId, messageId);
  }
  if (data.startsWith("profile:delete:")) {
    const slot = Number(data.split(":")[2]);
    if (!slot) return;
    return edit(chatId, messageId, "🗑 <b>Suchprofil löschen?</b>\\n\\nDiese Aktion kann nicht rückgängig gemacht werden.", { inline_keyboard: [[button("Ja, löschen", `profile:delete-confirm:${slot}`)],[button("← Abbrechen", `profile:view:${slot}`)]] });
  }
'''
          if anchor not in s: raise SystemExit('callback anchor missing')
          s=s.replace(anchor,add+anchor,1)
          p.write_text(s)
          PY
          grep -q 'Weiter ➡️' supabase/functions/telegram-ui/index.ts
          grep -q 'profile:delete-confirm:' supabase/functions/telegram-ui/index.ts
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-ui/index.ts
          git commit -m 'Adjust Telegram profile and saved menus'
          git push
      - name: Deploy
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy telegram-ui --project-ref dpmohkrwdlicexwcrqfy --no-verify-jwt
