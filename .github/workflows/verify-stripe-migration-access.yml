name: Verify Stripe migration access
on:
  push:
    branches:
      - migration/verify-stripe-access-20261111
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check existing Stripe credentials without exposing them
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
        run: |
          node <<'NODE'
          (async () => {
            const stripe = process.env.STRIPE_SECRET_KEY || process.env.STRIPE_API_KEY || process.env.STRIPE_LIVE_SECRET_KEY || process.env.STRIPE_RESTRICTED_KEY || '';
            console.log('STRIPE_TOKEN_PRESENT=' + Boolean(stripe));
            if (stripe) {
              const r = await fetch('https://api.stripe.com/v1/payment_links/plink_1UAy8Z2NorDNIWqI9h5j73q0', { headers: { Authorization: 'Bearer ' + stripe } });
              console.log('STRIPE_PAYMENT_LINK_STATUS=' + r.status);
            }
          })().catch(() => { console.error('ACCESS_CHECK_FAILED'); process.exitCode = 1; });
          NODE
