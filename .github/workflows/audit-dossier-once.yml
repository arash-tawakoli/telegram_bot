name: Audit removed portfolio feature

on:
  push:
    paths:
      - '.github/workflows/audit-dossier-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find feature references
        shell: bash
        run: |
          set +e
          grep -RniE --exclude='audit-dossier-once.yml' --exclude-dir=.git '(Bewerbermappe|bewerbungsmappe|dossier|applicant_profile|application_documents|application-documents|guard_applicant|dossier_input|DOCUMENT_KINDS|PROFILE_FIELDS|privateApplicant|purgeApplicantDocuments|clearDossierInput)' .
          exit 0
      - name: Remove one-time audit
        shell: bash
        run: |
          git rm .github/workflows/audit-dossier-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time dossier audit'
          git push
