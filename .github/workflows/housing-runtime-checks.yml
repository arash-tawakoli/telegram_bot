name: Housing Runtime Checks

on:
  pull_request:
    paths:
      - "cloudflare/housing-runtime/**"
      - ".github/workflows/housing-runtime-checks.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/housing-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/housing-runtime/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
