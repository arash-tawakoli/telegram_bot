name: ImmoScout Public Pagination Acceptance

on:
  push:
    paths:
      - '.immoscout-pagination-test-trigger'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test public district pagination
        shell: bash
        run: |
          node <<'NODE'
          const districts = [
            ['bergedorf','https://www.immobilienscout24.de/Suche/de/hamburg/hamburg/bergedorf/wohnung-mieten'],
            ['altona','https://www.immobilienscout24.de/Suche/de/hamburg/hamburg/altona/wohnung-mieten'],
            ['hamburg-mitte','https://www.immobilienscout24.de/Suche/de/hamburg/hamburg/hamburg-mitte/wohnung-mieten'],
          ];
          const headers = {
            'user-agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36',
            'accept':'text/html,application/xhtml+xml',
            'accept-language':'de-DE,de;q=0.9,en;q=0.7',
            'cache-control':'no-cache'
          };
          const strip=s=>s.replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/&amp;/gi,'&').replace(/\s+/g,' ').trim();
          function idsFrom(html){
            const s=new Set();
            for(const m of html.matchAll(/\/expose\/(\d{6,12})/gi)) s.add(m[1]);
            for(const m of html.matchAll(/["']exposeId["']\s*:\s*["']?(\d{6,12})/gi)) s.add(m[1]);
            for(const m of html.matchAll(/data-obid=["'](\d{6,12})["']/gi)) s.add(m[1]);
            return [...s];
          }
          function totalFrom(html){
            const t=strip(html);
            for(const p of [/([\d.]+)\s+Mietwohnungen\s+in\s+/i,/([\d.]+)\s+Wohnungen[^.]{0,80}\bMiete\b/i,/([\d.]+)\s+Treffer/i]){
              const m=t.match(p); if(m) return Number(m[1].replace(/\./g,''));
            }
            return null;
          }
          async function get(url){
            const r=await fetch(url,{headers,redirect:'follow'});
            return {status:r.status,url:r.url,text:await r.text()};
          }
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const results=[];
          for(const [name,base] of districts){
            const unique=new Set();
            const samples=[];
            let reported=null, failures=0, pages=0, stopReason='max_pages';
            let prevSig='';
            for(let p=1;p<=80;p++){
              const url=p===1?base:`${base}?pagenumber=${p}`;
              let r;
              try{r=await get(url)}catch(e){failures++; samples.push({page:p,error:String(e)}); stopReason='fetch_error'; break;}
              const ids=idsFrom(r.text);
              if(p===1) reported=totalFrom(r.text);
              pages++;
              const before=unique.size; ids.forEach(x=>unique.add(x)); const added=unique.size-before;
              const sig=ids.join(',');
              if(p<=3 || r.status!==200 || ids.length===0 || added===0) samples.push({page:p,status:r.status,bytes:r.text.length,ids:ids.length,added,first:ids.slice(0,5),final_url:r.url});
              if(r.status!==200){failures++; stopReason=`http_${r.status}`; break;}
              if(ids.length===0){stopReason='empty_page'; break;}
              if(sig===prevSig || added===0){stopReason='duplicate_page'; break;}
              prevSig=sig;
              if(reported && unique.size>=reported){stopReason='reported_total_reached'; break;}
              if(p%5===0) await sleep(200);
            }
            results.push({district:name,reported_total:reported,pages_fetched:pages,unique_ids:unique.size,failures,stop_reason:stopReason,coverage:reported?unique.size/reported:null,samples});
          }
          console.log('ACCEPTANCE_RESULT='+JSON.stringify(results));
          NODE
