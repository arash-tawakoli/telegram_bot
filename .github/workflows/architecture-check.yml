name: Architecture check

on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'migration/**']

permissions:
  contents: read

concurrency:
  group: architecture-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Debounce direct main pushes
        if: github.event_name == 'push'
        run: sleep 45

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run architecture tests
        run: npm test

      - name: Validate runtime and migration registry
        env:
          RUNTIME_HASH_STRICT: '1'
        run: node scripts/check-runtime.mjs

      - name: Compare captured manifest with live Supabase runtime
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dpmohkrwdlicexwcrqfy
        run: node scripts/check-live-runtime.mjs

      - name: Validate architecture files
        run: |
          set -eu
          test -f docs/ARCHITECTURE.md
          test -f docs/source-connectors.md
          test -f supabase/seed.sql
          test -f supabase/functions/source-worker/index.ts
          test -f supabase/functions/source-worker/deno.json
          test -f supabase/functions/source-worker/shared.ts
          test -f supabase/functions/source-worker/scout.ts
          test -f supabase/functions/source-worker/klein.ts
          test -f supabase/functions/source-worker/immomio.ts
          test -f supabase/functions/source-worker/hpm.ts
          test -f supabase/functions/source-worker/generic.ts
          test -f supabase/functions/kleinanzeigen-transport/index.ts
          test -f supabase/functions/notification-dispatcher/index.ts
          test -f supabase/functions/telegram-ui/index.ts
          test -f supabase/functions/telegram-gateway/index.ts
          test ! -d supabase/functions/mini-app
          test ! -d supabase/static/mini-app
          test ! -f .github/workflows/kleinanzeigen-public-inventory.yml
          test ! -f scripts/kleinanzeigen-public-inventory.mjs
          test ! -f data/source_catalog.json

      - name: Validate v3 source seed
        run: |
          set -eu
          grep -q "Architecture-v3 bootstrap registry" supabase/seed.sql
          grep -q "runtime_mode" supabase/seed.sql
          grep -q "source-worker" supabase/seed.sql
          grep -q "adaptive_partition" supabase/seed.sql
          grep -q "district_hybrid" supabase/seed.sql
          grep -q "district_pagination" supabase/seed.sql
          grep -q "immomio_tenant" supabase/seed.sql
          grep -q "immosolve_api" supabase/seed.sql
          if grep -q "immomio_graphql" supabase/seed.sql; then
            echo 'Legacy Immomio connector kind remains in seed.' >&2
            exit 1
          fi

      - name: Reject Mini App runtime references
        run: |
          if grep -RInE \
            '(MINI_APP_URL|functions/v1/mini-app|traumwohnung-mini-app\.vercel\.app)' \
            supabase/functions/telegram-ui \
            supabase/functions/telegram-gateway \
            supabase/config.toml \
            docs/product-releases-2026-09-01.md; then
            echo 'Mini App reference remains in the command runtime.' >&2
            exit 1
          fi

      - name: Reject legacy runtime references
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=migrations --exclude='architecture-check.yml' --exclude='*.md' \
            '(source-job-runner|source-worker-v3|source-immoscout-fast|source-immoscout-rolling|source-kleinanzeigen-fast|source-kleinanzeigen-rolling|listing_enrichment)' \
            supabase/functions .github scripts 2>/dev/null; then
            echo 'Legacy runtime reference remains.' >&2
            exit 1
          fi

      - name: Reject obvious committed secrets
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' \
            '(sk-proj-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,})' .; then
            echo 'Potential secret found in repository.' >&2
            exit 1
          fi
