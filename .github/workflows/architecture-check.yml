name: Architecture check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate architecture files
        run: |
          set -eu
          test -f docs/ARCHITECTURE.md
          test -f docs/source-connectors.md
          test -f supabase/functions/source-worker/index.ts
          test -f supabase/functions/source-worker/deno.json
          test -f supabase/functions/source-worker/shared.ts
          test -f supabase/functions/source-worker/scout.ts
          test -f supabase/functions/source-worker/klein.ts
          test -f supabase/functions/source-worker/immomio.ts
          test -f supabase/functions/source-worker/hpm.ts
          test -f supabase/functions/source-worker/generic.ts
          test -f supabase/functions/notification-dispatcher/index.ts
          test -f supabase/functions/telegram-ui/index.ts
          test -f supabase/migrations/20260829195000_architecture_v3_final_cutover.sql
          test -f supabase/migrations/20260829204000_route_cron_to_canonical_source_worker.sql
          test -f supabase/migrations/20260829204100_restore_master_tier_gartenstadt_wandsbek.sql
          test -f supabase/migrations/20260829210500_require_complete_coverage_before_baseline.sql
          test ! -f .github/workflows/kleinanzeigen-public-inventory.yml
          test ! -f scripts/kleinanzeigen-public-inventory.mjs
          test ! -f data/source_catalog.json

      - name: Reject legacy runtime references
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=migrations --exclude='*.md' \
            '(source-job-runner|source-worker-v3|source-immoscout-fast|source-immoscout-rolling|source-kleinanzeigen-fast|source-kleinanzeigen-rolling|listing_enrichment)' \
            supabase/functions .github scripts 2>/dev/null; then
            echo 'Legacy runtime reference remains.' >&2
            exit 1
          fi

      - name: Reject obvious committed secrets
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' \
            '(sk-proj-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,})' .; then
            echo 'Potential secret found in repository.' >&2
            exit 1
          fi
