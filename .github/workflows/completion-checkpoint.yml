name: Completion checkpoint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/completion-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify current tests
        run: npm test
      - name: Verify registered code and migration structure
        run: node scripts/check-runtime.mjs
      - name: Check authenticated deployment availability without disclosing credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          const report={repositoryCommit:process.env.GITHUB_SHA,managementCredentialConfigured:Boolean(token),sourceWorker:null};
          if(token){
            const r=await fetch('https://api.supabase.com/v1/projects/dpmohkrwdlicexwcrqfy/functions/source-worker',{headers:{authorization:`Bearer ${token}`},signal:AbortSignal.timeout(20000)});
            report.managementStatus=r.status;
            if(r.ok){const f=await r.json();report.sourceWorker={slug:f.slug,version:f.version,verify_jwt:f.verify_jwt,status:f.status};}
          }
          fs.writeFileSync('completion-prerequisites.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          JS
      - name: Prepare source-only archive
        run: |
          mkdir -p checkpoint
          tar --exclude=.git --exclude=node_modules --exclude=checkpoint -czf checkpoint/current-source.tar.gz .
          cp completion-prerequisites.json checkpoint/
      - uses: actions/upload-artifact@v4
        with:
          name: completion-checkpoint
          path: checkpoint/
          retention-days: 2
