name: Premium preview cache refresh once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/premium-preview-cache-once.yml'

permissions:
  contents: write

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh premium preview URL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/telegram-ui/index.ts')
          source = path.read_text()
          old = '${SUPABASE_URL}/functions/v1/telegram-ui?asset=premium'
          new = '${SUPABASE_URL}/functions/v1/telegram-ui?asset=premium&v=20260903'
          if old not in source:
              raise SystemExit('premium preview URL anchor missing')
          path.write_text(source.replace(old, new, 1))
          PY
          grep -q 'asset=premium&v=20260903' supabase/functions/telegram-ui/index.ts

      - name: Commit source update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-ui/index.ts
          git commit -m 'Refresh Premium preview image URL'
          git push

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy telegram-ui
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy telegram-ui --project-ref dpmohkrwdlicexwcrqfy --no-verify-jwt
