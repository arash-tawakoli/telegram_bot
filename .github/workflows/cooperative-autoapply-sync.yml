name: Cooperative application synchronization
on:
  push:
    branches: [main]
    paths: [.github/workflows/cooperative-autoapply-sync.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply checksum-verified source files only
        shell: python
        run: |
          import base64,gzip,hashlib,json,pathlib
          encoded='''
          '''
          blob=base64.b64decode(encoded)
          assert hashlib.sha256(blob).hexdigest()=='97bcf7e97affecd0a409fdce62efba2bc3826ddd06fdaf3aed58c0166d0b0f3f'
          files=json.loads(gzip.decompress(blob))
          allowed={'supabase/migrations/20260919164605_expand_cooperative_auto_apply_targets.sql','docs/migration-registry.d/20260919-cooperative-auto-apply.json','supabase/functions/immomio-account/index.ts','supabase/functions/immomio-account/providers/immomio.ts','supabase/functions/immomio-account/credentials.ts','supabase/functions/immomio-application-worker/index.ts','tests/cooperative-auto-apply.test.mjs','tests/cooperative-account-gateway.test.mjs','tests/cooperative-worker.test.mjs','docs/COOPERATIVE_AUTO_APPLY_2026-09-19.md'}
          assert set(files)==allowed
          for name,text in files.items():
            p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          manifest=pathlib.Path('supabase/runtime-manifest.json')
          runtime=json.loads(manifest.read_text())
          updates=[('immomio-account',7,'f48f77e6391da1fb4c341dc68891389299677a9879d52aadd912ef2396009585'),('immomio-application-worker',2,'85c55e83f0b14cba28e42da65890e55e9d9b13736586deaf0d30b1e527e88f80')]
          for slug,version,artifact in updates:
            prefix='supabase/functions/'+slug+'/'
            entry={'slug':slug,'entrypoint':prefix+'index.ts','version':version,'verify_jwt':False,'import_map':False,'retired':False,'observed_artifact_sha256':artifact,'files':[]}
            for name in sorted(files):
              if name.startswith(prefix):entry['files'].append({'path':name,'sha256':hashlib.sha256(files[name].encode()).hexdigest(),'deployed_sha256':None})
            runtime['functions']=[x for x in runtime['functions'] if x['slug']!=slug]+[entry]
          runtime['observed_at']='2026-09-19'
          manifest.write_text(json.dumps(runtime,indent=2)+'\n')
          pathlib.Path('.github/workflows/cooperative-autoapply-sync.yml').unlink()
          print('Verified and applied 10 source/test/document files plus scoped manifest updates; no production deployment or user data access.')
      - name: Verify tests and repository structure
        run: |
          npm test > /tmp/cooperative-tests.log 2>&1 || { tail -n 120 /tmp/cooperative-tests.log; exit 1; }
          tail -n 14 /tmp/cooperative-tests.log
          node scripts/check-runtime.mjs
      - name: Commit tested synchronization to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b implementation/cooperative-autoapply-20260919
          git add supabase/functions/immomio-account supabase/functions/immomio-application-worker/index.ts supabase/migrations/20260919164605_expand_cooperative_auto_apply_targets.sql supabase/runtime-manifest.json docs/migration-registry.d/20260919-cooperative-auto-apply.json docs/COOPERATIVE_AUTO_APPLY_2026-09-19.md tests/cooperative-auto-apply.test.mjs tests/cooperative-account-gateway.test.mjs tests/cooperative-worker.test.mjs .github/workflows/cooperative-autoapply-sync.yml
          git commit -m 'Synchronize deployed cooperative auto-apply routing and object-level send protection'
          git push origin HEAD:implementation/cooperative-autoapply-20260919
