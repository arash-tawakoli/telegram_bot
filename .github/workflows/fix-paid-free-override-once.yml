name: Fix paid free override once
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-paid-free-override-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Stripe webhook
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/stripe-webhook/index.ts')
          s=p.read_text()
          old='''        const customerId = stripeId(object.customer) || null;\n        await applyEntitlement('''
          new='''        const customerId = stripeId(object.customer) || null;\n        if (paid) {\n          const { error: overrideError } = await db\n            .from("bot_users")\n            .update({\n              plan_override: null,\n              plan_override_expires_at: null,\n              updated_at: new Date().toISOString(),\n            })\n            .eq("id", userId)\n            .eq("plan_override", "free");\n          if (overrideError) throw overrideError;\n        }\n        await applyEntitlement('''
          if s.count(old) != 1:
              raise SystemExit(f'expected one checkout entitlement anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          grep -q '.eq("plan_override", "free")' supabase/functions/stripe-webhook/index.ts
          git diff --check
      - name: Commit and clean up
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-paid-free-override-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/stripe-webhook/index.ts .github/workflows/fix-paid-free-override-once.yml
          git commit -m "Clear free override after paid checkout"
          git push origin HEAD:main
