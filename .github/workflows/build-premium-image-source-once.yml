name: Build Premium HD image source once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-premium-image-source-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract Premium preview and build edge source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'supabase/functions/telegram-ui/index.ts';
          const src = fs.readFileSync(path, 'utf8');
          const m = src.match(/const\s+PREMIUM_PREVIEW_B64\s*=\s*([`'"])([\s\S]*?)\1\s*;/);
          if (!m || !m[2] || m[2].length < 10000) throw new Error('Premium HD base64 not found');
          const b64 = m[2].replace(/\s+/g, '');
          const out = `const B64=${JSON.stringify(b64)};\nfunction decode(s:string){const bin=atob(s);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes;}\nconst bytes=decode(B64);\nDeno.serve((req)=>{if(req.method!==\"GET\"&&req.method!==\"HEAD\")return new Response(\"method not allowed\",{status:405});return new Response(req.method===\"HEAD\"?null:bytes,{headers:{\"content-type\":\"image/jpeg\",\"content-length\":String(bytes.length),\"cache-control\":\"public, max-age=86400\",\"x-content-type-options\":\"nosniff\"}});});\n`;
          fs.mkdirSync('supabase/functions/telegram-premium-image', { recursive: true });
          fs.writeFileSync('supabase/functions/telegram-premium-image/index.ts', out);
          console.log(`Premium image base64 chars: ${b64.length}`);
          NODE
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/telegram-premium-image/index.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Premium HD image edge source"
            git push origin main
          fi
