name: Optimize Telegram callback reaction path

on:
  push:
    paths:
      - '.github/workflows/optimize-telegram-buttons-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch callback path and add regression tests
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          sed -i "4i import {stripTypeScriptTypes} from 'node:module';" tests/telegram-callback-latency.test.mjs
          perl -0pi -e "s/vm\.runInNewContext\(source\.slice\(source\.indexOf\('Deno\.serve\('\)\),scope\);/vm.runInNewContext(stripTypeScriptTypes(source.slice(source.indexOf('Deno.serve(')),{mode:'strip'}),scope);/g" tests/telegram-callback-latency.test.mjs
          npm ci --ignore-scripts
          npm test
          git rm .github/workflows/optimize-telegram-buttons-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/telegram-fast/index.ts supabase/functions/telegram-gateway/index.ts supabase/functions/telegram-ui/index.ts supabase/functions/telegram-ui/handlers.js tests/telegram-callback-latency.test.mjs
          git commit -m 'Make Telegram callbacks acknowledge immediately'
          git push
