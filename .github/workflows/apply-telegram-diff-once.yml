name: Apply verified Telegram source diff once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-telegram-diff-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply exact verified diff
        env:
          PATCH_B64: ""
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/telegram.patch
          git apply --check /tmp/telegram.patch
          git apply /tmp/telegram.patch
          deno check supabase/functions/telegram-ui/index.ts
          deno check supabase/functions/notification-dispatcher/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-ui/index.ts supabase/functions/notification-dispatcher/index.ts supabase/functions/stripe-webhook/index.ts
          git commit -m 'Refine Telegram premium referral and admin UX'
          git push
