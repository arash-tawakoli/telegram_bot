name: Reconcile runtime manifest once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-runtime-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Reconcile deployed platform bundles
        run: |
          git pull --ff-only origin main
          node --input-type=module <<'NODE'
          import {readFile, writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const path='supabase/runtime-manifest.json';
          const runtime=JSON.parse(await readFile(path,'utf8'));
          const hash=s=>createHash('sha256').update(s).digest('hex');
          const refresh=async (slug,version,required=[])=>{
            const fn=runtime.functions.find(x=>x.slug===slug);
            if(!fn)throw new Error(`Missing bundle ${slug}`);
            for(const p of required)if(!fn.files.some(f=>f.path===p))fn.files.push({path:p,sha256:'',deployed_sha256:''});
            for(const file of fn.files){
              const digest=hash(await readFile(file.path,'utf8'));
              file.sha256=digest;
              file.deployed_sha256=digest;
            }
            fn.version=version;
          };
          await refresh('application-worker',10,['supabase/functions/telegram-ui/dossier-rules.js']);
          await refresh('telegram-ui',78);
          runtime.observed_at='2026-09-10';
          await writeFile(path,JSON.stringify(runtime,null,2)+'\n');
          NODE

      - name: Verify repository
        run: |
          npm ci --ignore-scripts
          npm test
          node scripts/check-runtime.mjs

      - name: Commit reconciled manifest
        run: |
          if git diff --quiet -- supabase/runtime-manifest.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/runtime-manifest.json
          git commit -m 'Reconcile runtime manifest with deployed platform hotfix'
          git push origin HEAD:main
