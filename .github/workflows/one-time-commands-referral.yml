name: Apply commands and referral cleanup

on:
  push:
    branches:
      - fix/commands-referral-partner-removal
    paths:
      - .github/workflows/one-time-commands-referral.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal product changes
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/one-time-commands-referral.py
          python3 /tmp/one-time-commands-referral.py

      - name: Validate scope
        shell: bash
        run: |
          set -eu
          test -f supabase/migrations/20260901133000_remove_partner_mode_and_grant_referral_week.sql
          test ! -f supabase/functions/billing-maintenance/index.ts
          grep -q 'command: "commands"' supabase/functions/telegram-gateway/index.ts
          grep -q 'claim_referral_bonus' supabase/functions/telegram-ui/index.ts
          grep -q '7 Tage Premium kostenlos' supabase/static/mini-app/app.js
          if grep -RInE 'Partner-Modus|household_(members|invites)|household:(create|invite)|join_|Stripe-Gutschrift|balance_transactions' \
            supabase/functions supabase/static docs --exclude-dir=migrations; then
            echo 'Removed product references remain.' >&2
            exit 1
          fi

      - name: Commit product cleanup
        shell: bash
        run: |
          set -eu
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore commands menu and simplify referrals"
          git push origin HEAD
