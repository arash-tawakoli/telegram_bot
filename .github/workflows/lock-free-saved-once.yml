name: Lock free saved listings once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-free-saved-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lock Free saved callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/telegram-ui/index.ts')
          s=p.read_text()
          old='button(user.is_premium ? "⭐️ Gespeichert" : "🔒 ⭐️ Gespeichert", "saved"),'
          new='user.is_premium ? button("⭐️ Gespeichert", "saved") : button("🔒 ⭐️ Gespeichert", "premium"),'
          if s.count(old) != 1:
              raise SystemExit('saved button anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          deno check supabase/functions/telegram-ui/index.ts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-ui/index.ts
          git commit -m 'Lock saved listings for Free users'
          git push
