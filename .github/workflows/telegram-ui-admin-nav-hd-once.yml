name: Telegram UI admin nav HD once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/telegram-ui-admin-nav-hd-once.yml'
      - '.github/scripts/telegram_ui_admin_nav_hd_once.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image dependency
        run: python3 -m pip install --quiet pillow

      - name: Patch telegram-ui
        run: python3 .github/scripts/telegram_ui_admin_nav_hd_once.py

      - name: Normalize settings text escape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/telegram-ui/index.ts')
          source = path.read_text()
          bad = 'const text = "⚙️ <b>Einstellungen</b>\n\nVerwalte hier Premium, Sprache und Systemstatus.";'
          good = 'const text = "⚙️ <b>Einstellungen</b>\\n\\nVerwalte hier Premium, Sprache und Systemstatus.";'
          if bad not in source:
              raise SystemExit('malformed settings text anchor missing')
          path.write_text(source.replace(bad, good, 1))
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify telegram-ui
        run: |
          deno check supabase/functions/telegram-ui/index.ts
          grep -q '🎁 30 Tage Premium für 0 €' supabase/functions/telegram-ui/index.ts
          grep -q '414638980' supabase/functions/telegram-ui/index.ts
          grep -q 'admin:delete-confirm:' supabase/functions/telegram-ui/index.ts
          grep -q "interval '30 days'" supabase/migrations/202609030001_referral_bonus_30_days.sql

      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-ui/index.ts supabase/functions/telegram-ui/i18n.ts supabase/migrations/202609030001_referral_bonus_30_days.sql
          git commit -m 'Update Telegram navigation admin controls and Premium HD'
          git push
