name: Repair Telegram onboarding once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-telegram-onboarding-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete Telegram filter onboarding
        shell: bash
        env:
          SOURCE_COMMIT: 1e1e2ff3b7b6344599566455e1d4c238038ce61e
          WORKFLOW_PATH: .github/workflows/repair-telegram-onboarding-once.yml
        run: |
          set -euo pipefail
          git show "${SOURCE_COMMIT}:${WORKFLOW_PATH}" \
            | sed -n "/<<'PAYLOAD'/,/^PAYLOAD$/p" \
            | sed '1d;$d' \
            > /tmp/telegram-ui.ts.xz.b64
          test -s /tmp/telegram-ui.ts.xz.b64
          base64 --decode /tmp/telegram-ui.ts.xz.b64 \
            | xz --decompress \
            > supabase/functions/telegram-ui/index.ts

          grep -q 'Wähle eine oder mehrere Wohnungsarten' supabase/functions/telegram-ui/index.ts
          grep -q 'Bezirke auswählen' supabase/functions/telegram-ui/index.ts
          grep -q 'Stadtteile auswählen' supabase/functions/telegram-ui/index.ts
          grep -q 'property_types: draft.property_types' supabase/functions/telegram-ui/index.ts
          grep -q 'onConflict: "user_id,profile_slot"' supabase/functions/telegram-ui/index.ts
          if grep -qE '(MINI_APP_URL|web_app|functions/v1/mini-app)' supabase/functions/telegram-ui/index.ts; then
            echo 'Mini App reference detected' >&2
            exit 1
          fi
          git diff --check

          rm -f "${WORKFLOW_PATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/telegram-ui/index.ts "${WORKFLOW_PATH}"
          git commit -m "Restore complete Telegram filter onboarding"
          git push origin HEAD:main
