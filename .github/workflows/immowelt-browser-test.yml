name: Immowelt Browser Pagination Test

on:
  push:
    paths:
      - '.github/workflows/immowelt-browser-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core@24

      - name: Run real headful Chrome pagination test
        run: |
          cat > immowelt-test.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const BASE = 'https://www.immowelt.de/suche/mieten/wohnung/hamburg/hamburg-20095/ad08de1113';
          const chrome = '/usr/bin/google-chrome';
          const browser = await puppeteer.launch({
            executablePath: chrome,
            headless: false,
            args: ['--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1000'],
          });
          const page = await browser.newPage();
          await page.setViewport({width: 1440, height: 1000});
          const net = [];
          page.on('response', r => {
            const u = r.url();
            if (/serp-bff|classified-search|immowelt\.de\/suche/i.test(u)) net.push({status:r.status(), url:u.slice(0,500)});
          });
          const ids = async () => await page.evaluate(() => [...new Set([...document.querySelectorAll('a[href*="/expose/"]')].map(a => a.href.match(/\/expose\/([0-9a-f-]{16,})/i)?.[1]?.toLowerCase()).filter(Boolean))]);
          const state = async label => ({label,url:page.url(),title:await page.title(),ids:await ids(),body:(await page.evaluate(()=>document.body.innerText)).slice(0,300)});
          let navStatus=null;
          try { navStatus=(await page.goto(BASE,{waitUntil:'networkidle2',timeout:60000}))?.status()??null; } catch(e){navStatus=`goto_error:${e.message}`;}
          await new Promise(r=>setTimeout(r,3000));
          const p1=await state('p1');
          const click2=await page.evaluate(()=>{const b=[...document.querySelectorAll('button')].find(x=>x.innerText.trim()==='2');if(!b)return false;b.scrollIntoView({block:'center'});b.click();return true;});
          await new Promise(r=>setTimeout(r,6000));
          const p2=await state('p2');
          const s1=new Set(p1.ids),s2=new Set(p2.ids);
          const result={navStatus,click2,counts:{p1:p1.ids.length,p2:p2.ids.length},overlap:[...s1].filter(x=>s2.has(x)).length,p1:{...p1,ids:p1.ids.slice(0,40)},p2:{...p2,ids:p2.ids.slice(0,40)},network:net.slice(-60)};
          fs.writeFileSync('immowelt-browser-test.json',JSON.stringify(result,null,2));
          console.log('IMMOWELT_HEADFUL_RESULT='+JSON.stringify(result));
          await page.screenshot({path:'immowelt-browser-final.png'});
          await browser.close();
          EOF
          xvfb-run -a node immowelt-test.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immowelt-browser-test
          path: |
            immowelt-browser-test.json
            immowelt-browser-final.png
          if-no-files-found: ignore
