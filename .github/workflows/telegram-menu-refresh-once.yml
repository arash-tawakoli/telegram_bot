name: Telegram menu refresh once

on:
  push:
    branches: [main]
    paths:
      - scripts/telegram-menu-refresh-once.py
      - .github/workflows/telegram-menu-refresh-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply updates
        run: python3 scripts/telegram-menu-refresh-once.py

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const RENT_PRESETS = new Set(\[800, 1000, 1250, 2000\]);' supabase/functions/telegram-ui/index.ts
          grep -q 'const AREA_PRESETS = new Set(\[20, 50, 70, 90\]);' supabase/functions/telegram-ui/index.ts
          grep -q 'button("2.000 €", "rent:2000")' supabase/functions/telegram-ui/index.ts
          grep -q 'button("20 m²", "area:20")' supabase/functions/telegram-ui/index.ts
          grep -q '❤️ Gespeichert' supabase/functions/telegram-ui/index.ts
          grep -q '📡 Status' supabase/functions/telegram-ui/index.ts
          grep -q 'PAYMENT_LINK_ID = "plink_1UAy8Z2NorDNIWqI9h5j73q0"' supabase/functions/stripe-webhook/index.ts
          grep -q 'Danke für dein Abo!' supabase/functions/stripe-webhook/index.ts
          grep -q 'save: "❤️' supabase/functions/notification-dispatcher/labels.ts
          grep -q 'saved: "❤️' supabase/functions/notification-dispatcher/labels.ts
          if grep -q '1.500 €' supabase/functions/telegram-ui/index.ts; then exit 1; fi
          if grep -q '30 m²' supabase/functions/telegram-ui/index.ts; then exit 1; fi
          git diff --check

      - name: Export updated functions
        uses: actions/upload-artifact@v4
        with:
          name: telegram-menu-refresh
          path: |
            supabase/functions/telegram-ui/index.ts
            supabase/functions/stripe-webhook/index.ts
            supabase/functions/notification-dispatcher/index.ts
            supabase/functions/notification-dispatcher/labels.ts
          retention-days: 1

      - name: Commit changes and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/telegram-menu-refresh-once.py
          rm -f .github/workflows/telegram-menu-refresh-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh Telegram menu and subscription activation"
          git push origin HEAD:main
