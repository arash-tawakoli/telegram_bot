name: Premium preview update once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/premium-preview-once.yml'

permissions:
  contents: write

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch premium preview and price
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('supabase/functions/telegram-ui/index.ts')
          source = index.read_text()
          preview = Path('.github/tmp/premium-preview.b64').read_text().strip()

          source, preview_count = re.subn(
              r'const PREMIUM_PREVIEW_B64 = "[^"]*";',
              f'const PREMIUM_PREVIEW_B64 = "{preview}";',
              source,
              count=1,
          )
          if preview_count != 1:
              raise SystemExit('premium preview anchor missing')

          old_price = '<b>0,99 € / Monat</b>'
          new_price = '<s>1,99 €</s> <b>0,99 € / Monat</b>'
          if old_price not in source:
              raise SystemExit('premium price anchor missing')
          source = source.replace(old_price, new_price, 1)

          index.write_text(source)
          PY
          grep -q '<s>1,99 €</s> <b>0,99 € / Monat</b>' supabase/functions/telegram-ui/index.ts
          rm .github/tmp/premium-preview.b64

      - name: Commit source update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Update Premium preview and promotional price'
          git push

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy telegram-ui
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy telegram-ui --project-ref dpmohkrwdlicexwcrqfy --no-verify-jwt
