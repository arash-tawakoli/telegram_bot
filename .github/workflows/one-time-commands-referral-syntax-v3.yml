name: Complete commands syntax validation

on:
  push:
    branches:
      - fix/commands-referral-partner-removal
    paths:
      - .github/workflows/one-time-commands-referral-syntax-v3.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow syntax fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('supabase/functions/telegram-ui/index.ts')
          text = path.read_text()
          app_pattern = r'send\(c,"📱 <b>Traumwohnung Mini-App</b>\s*Öffne Suche, neue Angebote, Cockpit und Einstellungen in einer Ansicht\.",\{'
          app_replacement = r'send(c,`📱 <b>Traumwohnung Mini-App</b>\n\nÖffne Suche, neue Angebote, Cockpit und Einstellungen in einer Ansicht.`,{'
          text, app_count = re.subn(app_pattern, app_replacement, text, count=1)
          text, rmm_count = re.subn(r'rmm\(u,s\)', 'rmm(u)', text, count=1)
          if app_count != 1 or rmm_count != 1:
              raise SystemExit(f'replacement counts: app={app_count}, rmm={rmm_count}')
          path.write_text(text)
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          set -eu
          deno check supabase/functions/telegram-ui/index.ts
          deno check supabase/functions/telegram-gateway/index.ts
          deno check supabase/functions/mini-app/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
      - name: Check static Mini App JavaScript
        run: node --check supabase/static/mini-app/app.js
      - name: Commit fixes and remove one-time workflows
        run: |
          set -eu
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-check.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-syntax.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-syntax-v2.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-syntax-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix commands menu checks"
          git push origin HEAD
