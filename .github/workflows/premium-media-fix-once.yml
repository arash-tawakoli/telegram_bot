name: Premium media fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/premium-media-fix-once.yml'

permissions:
  contents: write

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Patch Premium media flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re

          path = Path('supabase/functions/telegram-ui/index.ts')
          source = path.read_text()
          payload = Path('.github/tmp/premium-preview-1024.b64').read_text().strip()

          raw = base64.b64decode(payload, validate=True)
          if not (raw.startswith(b'\xff\xd8') and raw.endswith(b'\xff\xd9')):
              raise SystemExit('replacement premium preview is not a valid JPEG')
          if hashlib.sha256(raw).hexdigest() != '62badc150c29b3088dc27120e040f85aed2af361e9154e6304ea11e6c57d8b07':
              raise SystemExit('replacement premium preview checksum mismatch')

          source, count = re.subn(
              r'const PREMIUM_PREVIEW_B64 = "[^"]*";',
              f'const PREMIUM_PREVIEW_B64 = "{payload}";',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('premium preview constant anchor missing')

          helper_start = source.index('async function sendPremiumPreview(')
          helper_end = source.index('async function acknowledge(', helper_start)
          helper = '''function premiumPreviewUrl() {
            return `${SUPABASE_URL}/functions/v1/telegram-ui?asset=premium&v=20260903b`;
          }

          async function sendPremiumPreview(chatId: number, caption: string, replyMarkup: any) {
            const language = chatLanguages.get(chatId);
            return telegram("sendPhoto", {
              chat_id: chatId,
              photo: premiumPreviewUrl(),
              caption: localizeText(caption, language),
              parse_mode: "HTML",
              reply_markup: localizeMarkup(replyMarkup, language),
            });
          }

          async function editPremiumPreview(chatId: number, messageId: number, caption: string, replyMarkup: any) {
            const language = chatLanguages.get(chatId);
            return telegram("editMessageMedia", {
              chat_id: chatId,
              message_id: messageId,
              media: {
                type: "photo",
                media: premiumPreviewUrl(),
                caption: localizeText(caption, language),
                parse_mode: "HTML",
              },
              reply_markup: localizeMarkup(replyMarkup, language),
            });
          }

          '''.replace('          ', '')
          source = source[:helper_start] + helper + source[helper_end:]

          old_signature = 'async function premium(user: any, chatId: number, _messageId?: number) {'
          new_signature = 'async function premium(user: any, chatId: number, messageId?: number, messageHasPhoto = false) {'
          if old_signature not in source:
              raise SystemExit('premium signature anchor missing')
          source = source.replace(old_signature, new_signature, 1)

          premium_start = source.index('async function premium(')
          premium_end = source.index('async function saved(', premium_start)
          premium_block = source[premium_start:premium_end]
          old_return = '  return sendPremiumPreview(chatId, text, { inline_keyboard: rows });\n}'
          new_return = '  const markup = { inline_keyboard: rows };\n  if (messageId && messageHasPhoto) return editPremiumPreview(chatId, messageId, text, markup);\n  return sendPremiumPreview(chatId, text, markup);\n}'
          if old_return not in premium_block:
              raise SystemExit('premium return anchor missing')
          premium_block = premium_block.replace(old_return, new_return, 1)
          source = source[:premium_start] + premium_block + source[premium_end:]

          old_callback = '  if (data === "premium") return premium(user, chatId, messageId);'
          new_callback = '''  if (data === "premium") {
            if (query.message?.photo) return premium(user, chatId, messageId, true);
            await telegram("deleteMessage", { chat_id: chatId, message_id: messageId }).catch(() => {});
            return premium(user, chatId);
          }'''.replace('          ', '')
          if old_callback not in source:
              raise SystemExit('premium callback anchor missing')
          source = source.replace(old_callback, new_callback, 1)

          path.write_text(source)
          PY

          grep -q 'editMessageMedia' supabase/functions/telegram-ui/index.ts
          grep -q 'v=20260903b' supabase/functions/telegram-ui/index.ts
          grep -q '<s>1,99 €</s> <b>0,99 € / Monat</b>' supabase/functions/telegram-ui/index.ts

      - name: Commit source change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-ui/index.ts
          git commit -m 'Fix Premium media preview'
          git push

      - name: Deploy telegram-ui
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy telegram-ui --project-ref dpmohkrwdlicexwcrqfy --no-verify-jwt

      - name: Verify Premium asset
        shell: bash
        run: |
          set -eu
          url='https://dpmohkrwdlicexwcrqfy.supabase.co/functions/v1/telegram-ui?asset=premium&v=20260903b'
          code=$(curl -sS -o /tmp/premium.jpg -w '%{http_code}' "$url")
          test "$code" = '200'
          test "$(head -c 2 /tmp/premium.jpg | xxd -p)" = 'ffd8'
          test "$(tail -c 2 /tmp/premium.jpg | xxd -p)" = 'ffd9'
          test "$(wc -c < /tmp/premium.jpg)" -eq 6944
