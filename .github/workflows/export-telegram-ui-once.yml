name: Export Telegram UI once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-telegram-ui-once.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify export target
        run: |
          set -euo pipefail
          test -s supabase/functions/telegram-ui/index.ts
          grep -q 'command === "/admin"' supabase/functions/telegram-ui/index.ts
          grep -q 'Freunde empfehlen' supabase/functions/telegram-ui/index.ts

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-ui-source
          path: supabase/functions/telegram-ui/index.ts
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-shot export workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-telegram-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/export-telegram-ui-once.yml
          git commit -m "Remove one-shot Telegram UI export"
          git push origin HEAD:main
