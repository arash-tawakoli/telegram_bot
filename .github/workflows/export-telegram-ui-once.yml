name: Export telegram-ui once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-telegram-ui-once.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-ui-source
          path: supabase/functions/telegram-ui
          if-no-files-found: error
          retention-days: 1
