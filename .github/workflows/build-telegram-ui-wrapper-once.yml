name: Build current Telegram UI runtime wrapper once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-telegram-ui-wrapper-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build compressed self-contained runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          index = Path('supabase/functions/telegram-ui/index.ts').read_text()
          i18n = Path('supabase/functions/telegram-ui/i18n.ts').read_text()
          anchor = 'import { LANGS, localizeMarkup, localizeText } from "./i18n.ts";'
          if anchor not in index:
              raise SystemExit('i18n import anchor missing')
          runtime = index.replace(anchor, i18n, 1)
          runtime, n = re.subn(
              r'const PREMIUM_PREVIEW_B64 = \[.*?\]\.join\(""\);',
              'const PREMIUM_PREVIEW_B64 = "";',
              runtime,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('premium payload anchor missing')
          runtime, n = re.subn(
              r'function premiumPreviewUrl\(\) \{.*?\n\}',
              'function premiumPreviewUrl() {\n  return `${SUPABASE_URL}/functions/v1/telegram-premium-image?v=20260903hd2`;\n}',
              runtime,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('premium url anchor missing')
          if 'button("🔒 ⭐️ Gespeichert", "premium")' not in runtime:
              raise SystemExit('free saved lock missing')

          payload = base64.b64encode(gzip.compress(runtime.encode(), compresslevel=9)).decode()
          chunks = [payload[i:i+2000] for i in range(0, len(payload), 2000)]
          lines = ',\n'.join('  ' + repr(chunk) for chunk in chunks)
          wrapper = '''import "jsr:@supabase/functions-js/edge-runtime.d.ts";\nimport { createClient } from "npm:@supabase/supabase-js@2.112.4";\nconst B64 = [\n%s\n].join("");\nconst raw = Uint8Array.from(atob(B64), c => c.charCodeAt(0));\nconst source = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text();\nconst AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;\nawait new AsyncFunction("createClient", source)(createClient);\n''' % lines
          Path('supabase/functions/telegram-ui/runtime-wrapper.ts').write_text(wrapper)
          PY
          deno check supabase/functions/telegram-ui/runtime-wrapper.ts
      - name: Commit wrapper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-ui/runtime-wrapper.ts
          git commit -m 'Build current Telegram UI runtime wrapper'
          git push
