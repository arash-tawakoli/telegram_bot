name: Sync auto-apply metadata
on:
  push:
    branches: [feature/auto-apply-v2]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/sync-auto-apply-metadata.mjs'
      - '.github/workflows/sync-auto-apply-metadata.yml'
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-apply-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-auto-apply-metadata.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration-registry.json supabase/runtime-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync auto-apply runtime metadata"
            git push origin HEAD:feature/auto-apply-v2
          fi
