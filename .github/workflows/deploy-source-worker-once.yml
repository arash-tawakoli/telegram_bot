name: Deploy source worker once
on:
  push:
    paths:
      - '.github/workflows/deploy-source-worker-once.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy source-worker --project-ref dpmohkrwdlicexwcrqfy --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
