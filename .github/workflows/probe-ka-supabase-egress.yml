name: Probe Kleinanzeigen via Supabase egress

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-ka-supabase-egress.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call temporary Supabase probe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://dpmohkrwdlicexwcrqfy.supabase.co/functions/v1/ka-gateway-egress-probe' | jq -c .