name: Housing runtime validation

on:
  push:
    branches:
      - fix/restore-standalone-immoscout-test-mode-20261110
  pull_request:
    branches:
      - migration/cloudflare-housing-core-20261103
    paths:
      - "cloudflare/housing-runtime/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/housing-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/housing-runtime/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
