name: Housing runtime validation

on:
  push:
    branches:
      - main
      - fix/restore-standalone-immoscout-test-mode-20261110
      - migration/cloudflare-housing-core-20261103
  pull_request:
    branches:
      - main
      - migration/cloudflare-housing-core-20261103
    paths:
      - "cloudflare/housing-runtime/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/housing-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/housing-runtime/package-lock.json
      - run: npm ci
      - name: Capture housing runtime checks and tests
        run: |
          npm run check > ci-check.log 2>&1
          check_result=$?
          npm test > ci-test.log 2>&1
          test_result=$?
          echo "Check exit: $check_result, test exit: $test_result"
          if [ "$check_result" -ne 0 ] || [ "$test_result" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: housing-runtime-ci-diagnostics
          path: cloudflare/housing-runtime/ci-*.log
          if-no-files-found: ignore
