name: Finalize obsolete portfolio removal

on:
  push:
    paths:
      - '.github/workflows/remove-portfolio-finalize-once.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove, test, audit and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/remove_portfolio.py
          git rm .github/remove_portfolio.py .github/workflows/remove-portfolio-feature-once.yml .github/workflows/remove-portfolio-finalize-once.yml
          npm ci --ignore-scripts
          npm test
          node scripts/check-runtime.mjs
          if grep -RniE --exclude-dir=.git --exclude-dir=node_modules '(Bewerbermappe|bewerbungsmappe|dossier|applicant_profile|application_documents|application-documents|guard_applicant|dossier_input|DOCUMENT_KINDS|PROFILE_FIELDS|privateApplicant|purgeApplicantDocuments|clearDossierInput)' .; then
            echo 'Removed feature reference remains in current tree' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove obsolete application portfolio feature'
          git push
          git push origin --delete feat/premium-applicant-dossier-20260909 || true
