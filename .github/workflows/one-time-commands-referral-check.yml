name: Validate commands and referral changes

on:
  push:
    branches:
      - fix/commands-referral-partner-removal
    paths:
      - .github/workflows/one-time-commands-referral-check.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          set -eu
          deno check supabase/functions/telegram-ui/index.ts
          deno check supabase/functions/telegram-gateway/index.ts
          deno check supabase/functions/mini-app/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
      - name: Check static Mini App JavaScript
        run: node --check supabase/static/mini-app/app.js
      - name: Remove one-time check workflow
        run: |
          set -eu
          git rm .github/workflows/one-time-commands-referral-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time validation workflow"
          git push origin HEAD
