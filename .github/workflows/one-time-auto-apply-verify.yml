name: One-time auto-apply verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-auto-apply-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/check-runtime.mjs
