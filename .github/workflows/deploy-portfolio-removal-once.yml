name: Deploy portfolio-free Supabase runtime

on:
  push:
    paths:
      - '.github/workflows/deploy-portfolio-removal-once.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dpmohkrwdlicexwcrqfy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy exact tested runtime and self-clean
        shell: bash
        run: |
          set +e
          status=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'SUPABASE_ACCESS_TOKEN repository secret is unavailable'
            status=97
          else
            supabase functions deploy telegram-ui --project-ref "$PROJECT_REF" --no-verify-jwt || status=$?
            [ "$status" -eq 0 ] && supabase functions deploy application-worker --project-ref "$PROJECT_REF" --no-verify-jwt || [ "$status" -ne 0 ]
            [ "$status" -eq 0 ] && supabase functions deploy telegram-fast --project-ref "$PROJECT_REF" --no-verify-jwt || [ "$status" -ne 0 ]
            [ "$status" -eq 0 ] && supabase functions deploy telegram-gateway --project-ref "$PROJECT_REF" --no-verify-jwt || [ "$status" -ne 0 ]
          fi
          git rm .github/workflows/deploy-portfolio-removal-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time portfolio runtime deployer'
          git push
          exit "$status"
