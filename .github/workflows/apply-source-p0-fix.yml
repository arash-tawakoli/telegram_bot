name: Apply source P0 fix
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/apply-source-p0-fix.yml']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch source validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/source-worker/shared.ts')
          s=p.read_text()
          old="function validCandidate(c:Candidate){if(!c.url||BAD_CANONICAL_URL.test(c.url))return false;if(c.zip&&!hhZip(c.zip))return false;const text=`${c.title||''} ${c.type||''} ${c.raw?.text||''}`;if(NON_RESIDENTIAL.test(text)&&!RESIDENTIAL.test(text))return false;return true}"
          new="function validCandidate(source:Source,c:Candidate){if(!c.url||BAD_CANONICAL_URL.test(c.url))return false;if(source.id===8&&!/\\/wohnungssuche\\/hamburg\\//i.test(c.url))return false;if(source.id===21&&!/\\/wohnung-mieten\\/hamburg\\//i.test(c.url))return false;if(c.zip&&!hhZip(c.zip))return false;const text=`${c.title||''} ${c.type||''} ${c.raw?.text||''}`;if(NON_RESIDENTIAL.test(text)&&!RESIDENTIAL.test(text))return false;return true}"
          if old not in s: raise SystemExit('validator anchor missing')
          s=s.replace(old,new,1)
          old2="for(const c of cands){if(!validCandidate(c))continue;"
          new2="for(const c of cands){if(!validCandidate(source,c))continue;"
          if old2 not in s: raise SystemExit('upsert anchor missing')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Commit
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add supabase/functions/source-worker/shared.ts
          git diff --cached --check
          git commit -m 'Enforce Hamburg listing validation for GCP and Tauschwohnung'
          git push
