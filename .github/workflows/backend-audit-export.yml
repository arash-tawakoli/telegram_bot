name: Backend audit snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/backend-audit-export.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      AUDIT_PAYLOAD_SHA256: 786bc1b6cfeb843b2eb203d59903fc02d1617c5a6351234e0f7d61fd42e56da8
      AUDIT_PAYLOAD: |
        
        
        
        
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify patch and prepare exact file updates
        run: |
          python - <<'PY'
          import os,json,base64,gzip,hashlib,pathlib
          raw=gzip.decompress(base64.b64decode(os.environ['AUDIT_PAYLOAD']))
          assert hashlib.sha256(raw).hexdigest()==os.environ['AUDIT_PAYLOAD_SHA256'],'Payload checksum mismatch'
          pathlib.Path(os.environ['RUNNER_TEMP'],'audit-payload.json').write_bytes(raw)
          script='''import os,json,pathlib,hashlib,sys
          payload=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'audit-payload.json').read_text())
          root=pathlib.Path.cwd().resolve()
          for e in payload[sys.argv[1]]:
              p=root/e['path']
              p.resolve().relative_to(root)
              assert e['path'].startswith(('supabase/','docs/','tests/'))
              if e['before'] is None:
                  assert not p.exists(),e['path']
                  text=e['content']
              else:
                  text=p.read_text()
                  assert hashlib.sha256(text.encode()).hexdigest()==e['before'],e['path']
                  for start,end,part in reversed(e['ops']): text=text[:start]+part+text[end:]
                  assert hashlib.sha256(text.encode()).hexdigest()==e['after'],e['path']
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text)
          '''
          pathlib.Path(os.environ['RUNNER_TEMP'],'apply-audit.py').write_text(script)
          PY
      - name: Apply production database export and v72 source synchronization
        run: python "$RUNNER_TEMP/apply-audit.py" main
      - name: Verify production synchronization
        run: |
          npm test
          node scripts/check-runtime.mjs
      - name: Commit tested database synchronization to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs supabase tests
          git commit -m 'Record live efficiency migrations and restore source-worker v72 semantics'
          git push origin HEAD:refs/heads/audit/backend-db-sync-20260919
          echo "MAIN_AUDIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_AUDIT_COMMIT=$(git rev-parse HEAD)"
      - name: Apply separately staged crawl budget improvements
        run: python "$RUNNER_TEMP/apply-audit.py" crawl
      - name: Verify pending crawl rollout
        run: |
          npm test
          node scripts/check-runtime.mjs
      - name: Commit tested crawl changes without deploying production
        run: |
          git add docs supabase tests
          git commit -m 'Stage bounded coverage budgets and catalogue cursor fixes'
          git push origin HEAD:refs/heads/audit/crawl-budget-20260919
          echo "MAIN_AUDIT_COMMIT=$MAIN_AUDIT_COMMIT"
          echo "CRAWL_AUDIT_COMMIT=$(git rev-parse HEAD)"
          printf 'Main synchronization: %s\nPending crawl changes: %s\n' "$MAIN_AUDIT_COMMIT" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
