name: Backend audit snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/backend-audit-export.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: backend-audit-snapshot
          retention-days: 1
          path: |
            supabase/
            docs/
            scripts/
            tests/
            package.json
            package-lock.json
            node_modules/@electric-sql/pglite/
