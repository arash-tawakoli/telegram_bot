name: Backend audit snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/backend-audit-export.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing Supabase deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Existing Supabase deployment credential is available.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No Supabase deployment credential is configured for GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
          fi
