name: Export Telegram runtime once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-telegram-runtime-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-runtime
          path: |
            supabase/functions/telegram-ui
            supabase/functions/telegram-gateway
          if-no-files-found: error
          retention-days: 1
