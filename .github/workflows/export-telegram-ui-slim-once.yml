name: Export telegram-ui full once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-telegram-ui-slim-once.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-ui-full-source
          path: |
            supabase/functions/telegram-ui/index.ts
            supabase/functions/telegram-ui/i18n.ts
