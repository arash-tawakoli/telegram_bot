name: Apply Telegram premium referral patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-telegram-premium-referral-patch-once.yml'
      - '.github/patches/telegram-premium-referral.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply exact patch
        run: |
          git apply --check .github/patches/telegram-premium-referral.patch
          git apply .github/patches/telegram-premium-referral.patch
          deno check supabase/functions/telegram-ui/index.ts
          deno check supabase/functions/notification-dispatcher/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
          grep -q '🔎 ${draftName} • Entwurf' supabase/functions/telegram-ui/index.ts
          grep -q '🔒 ⭐️ Gespeichert' supabase/functions/telegram-ui/index.ts
          grep -q 'complete_referral_reward' supabase/functions/telegram-ui/index.ts
          grep -q 'message_effect_id: PARTY_EFFECT_ID' supabase/functions/telegram-ui/index.ts
          grep -q 'callback_data: "premium"' supabase/functions/notification-dispatcher/index.ts
          grep -q 'PARTY_EFFECT_ID' supabase/functions/stripe-webhook/index.ts
          ! grep -q 'status: "subscribed"' supabase/functions/stripe-webhook/index.ts
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-ui/index.ts supabase/functions/notification-dispatcher/index.ts supabase/functions/stripe-webhook/index.ts
          git commit -m 'Refine Telegram premium referral UX'
          git push
