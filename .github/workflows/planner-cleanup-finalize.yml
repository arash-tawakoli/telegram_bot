name: Finalize planner removal manifest
on:
  push:
    paths:
      - '.github/workflows/planner-cleanup-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize manifest and remove temporary audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = 'supabase/runtime-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const sha256 = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');

          const fast = manifest.functions.find(fn => fn.slug === 'telegram-fast');
          if (!fast) throw new Error('telegram-fast missing');
          fast.version = 4;
          for (const file of fast.files) {
            const h = sha256(file.path);
            file.sha256 = h;
            file.deployed_sha256 = h;
          }

          const ui = manifest.functions.find(fn => fn.slug === 'telegram-ui');
          if (!ui) throw new Error('telegram-ui missing');
          ui.version = 100;
          ui.files = ui.files.filter(file =>
            file.path !== 'supabase/functions/telegram-ui/organizer.js' &&
            file.path !== 'supabase/functions/notification-dispatcher/source-facts.ts'
          );
          for (const file of ui.files) {
            const h = sha256(file.path);
            file.sha256 = h;
            file.deployed_sha256 = h;
          }

          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          git show d5cd2ec27e303880c196698225d654e75714bded:scripts/check-runtime.mjs > scripts/check-runtime.mjs
          git rm .github/workflows/planner-cleanup-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/runtime-manifest.json scripts/check-runtime.mjs
          git commit -m 'Synchronize runtime manifest after feature removal'
          git push
