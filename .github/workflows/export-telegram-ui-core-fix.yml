name: Export Telegram UI Core Fix
on:
  push:
    paths:
      - '.github/workflows/export-telegram-ui-core-fix.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-ui-core-source
          path: supabase/functions/telegram-ui/
          if-no-files-found: error
          retention-days: 1
