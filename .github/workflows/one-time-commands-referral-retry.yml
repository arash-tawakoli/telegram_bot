name: Retry commands and referral cleanup

on:
  push:
    branches:
      - fix/commands-referral-partner-removal
    paths:
      - .github/workflows/one-time-commands-referral-retry.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and apply corrected patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          workflow = Path('.github/workflows/one-time-commands-referral.yml').read_text()
          match = re.search(r"printf '%s' '([^']+)' \| base64 -d \| gzip -d", workflow)
          if not match:
              raise SystemExit('embedded patch not found')
          script = gzip.decompress(base64.b64decode(match.group(1))).decode()
          lines = script.splitlines()
          changed = False
          for index, line in enumerate(lines):
              if 'Partner-Modus</b>.*?<div id=' in line and line.lstrip().startswith("r'"):
                  lines[index] = '    r\'<section class="card"><b>Partner-Modus</b>.*?<div id="inviteOut"></div></section>\','
                  changed = True
                  break
          if not changed:
              raise SystemExit('static partner regex not found')
          Path('/tmp/one-time-commands-referral.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/one-time-commands-referral.py

      - name: Validate scope
        shell: bash
        run: |
          set -eu
          test -f supabase/migrations/20260901133000_remove_partner_mode_and_grant_referral_week.sql
          test ! -f supabase/functions/billing-maintenance/index.ts
          grep -q 'command: "commands"' supabase/functions/telegram-gateway/index.ts
          grep -q 'claim_referral_bonus' supabase/functions/telegram-ui/index.ts
          grep -q '7 Tage Premium kostenlos' supabase/static/mini-app/app.js
          if grep -RInE 'Partner-Modus|household_(members|invites)|household:(create|invite)|join_|Stripe-Gutschrift|balance_transactions' \
            supabase/functions supabase/static docs --exclude-dir=migrations; then
            echo 'Removed product references remain.' >&2
            exit 1
          fi

      - name: Commit product cleanup
        shell: bash
        run: |
          set -eu
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore commands menu and simplify referrals"
          git push origin HEAD
