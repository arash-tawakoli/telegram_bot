name: Deploy Telegram UI once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-telegram-ui-once.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: dpmohkrwdlicexwcrqfy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy telegram-ui only
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          supabase functions deploy telegram-ui --project-ref "${PROJECT_ID}" --use-api

      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/deploy-telegram-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-telegram-ui-once.yml
          git commit -m "Remove one-shot Telegram UI deploy"
          git push origin HEAD:main
