name: Export source worker fix
on:
  push:
    paths: ['.github/workflows/export-source-worker-fix.yml']
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-worker-fix
          path: supabase/functions/source-worker/
          if-no-files-found: error
          retention-days: 1
