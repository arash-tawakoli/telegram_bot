name: Remove Mini App runtime once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-mini-app-runtime-once.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN_PRIMARY: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ACCESS_TOKEN_FALLBACK: ${{ secrets.SUPABASE_TOKEN }}
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_API_TOKEN }}
      SUPABASE_PROJECT_REF: dpmohkrwdlicexwcrqfy
      VERCEL_SCOPE: nexa-labs-gmb-h
      VERCEL_PROJECT: traumwohnung-mini-app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy command-only Telegram runtime and remove Supabase Mini App functions
        run: |
          set -eu
          TOKEN="${SUPABASE_ACCESS_TOKEN_PRIMARY:-${SUPABASE_ACCESS_TOKEN_FALLBACK:-}}"
          if [ -z "$TOKEN" ]; then
            echo "SUPABASE_CLEANUP=SKIPPED_NO_TOKEN"
            echo "Supabase cleanup skipped: no repository access token." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          npx --yes supabase@latest functions deploy telegram-ui \
            --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          npx --yes supabase@latest functions deploy telegram-gateway \
            --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          for SLUG in mini-app mini-app-publisher; do
            CODE=$(curl -sS -o "/tmp/${SLUG}.json" -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/${SLUG}")
            if [ "$CODE" != "200" ] && [ "$CODE" != "404" ]; then
              cat "/tmp/${SLUG}.json"
              exit 1
            fi
          done
          echo "SUPABASE_CLEANUP=SUCCESS"
          echo "Supabase functions deployed; Mini App functions removed." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Vercel Mini App project
        run: |
          set -eu
          TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          if [ -z "$TOKEN" ]; then
            echo "VERCEL_CLEANUP=SKIPPED_NO_TOKEN"
            echo "Vercel cleanup skipped: no repository access token." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes vercel@latest remove "$VERCEL_PROJECT" \
            --yes --scope "$VERCEL_SCOPE" --token "$TOKEN"
          echo "VERCEL_CLEANUP=SUCCESS"
          echo "Vercel Mini App project removed." >> "$GITHUB_STEP_SUMMARY"
