name: Retry commands syntax validation

on:
  push:
    branches:
      - fix/commands-referral-partner-removal
    paths:
      - .github/workflows/one-time-commands-referral-syntax-v2.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Telegram UI syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('supabase/functions/telegram-ui/index.ts')
          text = path.read_text()
          pattern = r'send\(c,"📱 <b>Traumwohnung Mini-App</b>\s*Öffne Suche, neue Angebote, Cockpit und Einstellungen in einer Ansicht\.",\{'
          replacement = r'send(c,`📱 <b>Traumwohnung Mini-App</b>\n\nÖffne Suche, neue Angebote, Cockpit und Einstellungen in einer Ansicht.`,{'
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Mini App command replacement count: {count}')
          path.write_text(updated)
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          set -eu
          deno check supabase/functions/telegram-ui/index.ts
          deno check supabase/functions/telegram-gateway/index.ts
          deno check supabase/functions/mini-app/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
      - name: Check static Mini App JavaScript
        run: node --check supabase/static/mini-app/app.js
      - name: Commit fix and remove one-time workflows
        run: |
          set -eu
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-check.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-syntax.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-syntax-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix commands menu syntax"
          git push origin HEAD
