name: Patch auto-apply gateway
on:
  push:
    branches: [feature/auto-apply-v2]
    paths:
      - 'scripts/patch-auto-apply-gateway.mjs'
      - 'supabase/functions/telegram-gateway/auto-apply.ts'
      - '.github/workflows/patch-auto-apply-gateway.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-apply-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/patch-auto-apply-gateway.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-gateway/index.ts supabase/runtime-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Route auto-apply callbacks in gateway"
            git push origin HEAD:feature/auto-apply-v2
          fi
