name: Remove obsolete portfolio feature

on:
  push:
    paths:
      - '.github/workflows/remove-portfolio-feature-once.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove feature and verify architecture
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/remove-feature.py
          python3 /tmp/remove-feature.py
          npm ci --ignore-scripts
          npm test
          node scripts/check-runtime.mjs
          if grep -RniE --exclude='remove-portfolio-feature-once.yml' --exclude-dir=.git --exclude-dir=node_modules '(Bewerbermappe|bewerbungsmappe|dossier|applicant_profile|application_documents|application-documents|guard_applicant|dossier_input|DOCUMENT_KINDS|PROFILE_FIELDS|privateApplicant|purgeApplicantDocuments|clearDossierInput)' .; then
            echo 'Removed feature reference remains in current tree' >&2
            exit 1
          fi
          git rm .github/workflows/remove-portfolio-feature-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove obsolete application portfolio feature'
          git push
          git push origin --delete feat/premium-applicant-dossier-20260909 || true
