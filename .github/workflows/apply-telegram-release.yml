name: Apply Telegram product release

on:
  push:
    branches: [main]
    paths:
      - .release/telegram_release_payload.tar.xz.b64

permissions:
  contents: write

concurrency:
  group: apply-telegram-product-release
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract release payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .release/telegram_release_payload.tar.xz.b64 > /tmp/telegram-release.tar.xz
          echo "5a6ce38cf98ff7dece3c9a84cbde691716837dddfe2ac02307332ccc50efa5a9  /tmp/telegram-release.tar.xz" | sha256sum --check
          tar -xJf /tmp/telegram-release.tar.xz
          rm -rf .release
          rm -f .github/workflows/apply-telegram-release.yml

      - name: Commit verified release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes required."
            exit 0
          fi
          git commit -m "Complete Telegram product releases and billing hardening"
          git push origin HEAD:main
