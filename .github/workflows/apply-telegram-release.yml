name: Apply Telegram product release

on:
  push:
    branches: [main]
    paths:
      - .release/telegram_release_payload.part.*
      - .release/retry

permissions:
  contents: write

concurrency:
  group: apply-telegram-product-release
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract release payload
        shell: bash
        run: |
          set -euo pipefail
          cat .release/telegram_release_payload.part.* > /tmp/telegram-release.b64
          base64 --decode /tmp/telegram-release.b64 > /tmp/telegram-release.tar.xz
          sha256sum /tmp/telegram-release.tar.xz
          xz --test /tmp/telegram-release.tar.xz
          cat > /tmp/expected-files <<'EOF'
          docs/product-releases-2026-09-01.md
          supabase/config.toml
          supabase/functions/billing-maintenance/index.ts
          supabase/functions/mini-app/index.ts
          supabase/functions/notification-dispatcher/index.ts
          supabase/functions/notification-dispatcher/labels.ts
          supabase/functions/stripe-webhook/index.ts
          supabase/functions/telegram-gateway/index.ts
          supabase/migrations/20260901090000_finish_product_releases.sql
          supabase/migrations/20260901090100_schedule_billing_maintenance.sql
          supabase/migrations/20260901090200_household_saved_sync.sql
          supabase/migrations/20260901090300_fix_listing_change_array_append.sql
          supabase/static/mini-app/app.js
          supabase/static/mini-app/index.html
          supabase/static/mini-app/styles.css
          supabase/static/mini-app/vercel.json
          EOF
          tar -tJf /tmp/telegram-release.tar.xz | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          tar -xJf /tmp/telegram-release.tar.xz
          rm -rf .release
          rm -f .github/workflows/apply-telegram-release.yml

      - name: Commit verified release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes required."
            exit 0
          fi
          git commit -m "Complete Telegram product releases and billing hardening"
          git push origin HEAD:main
