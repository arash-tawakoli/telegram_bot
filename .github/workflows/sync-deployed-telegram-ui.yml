name: Sync deployed Telegram UI source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-deployed-telegram-ui.yml

permissions:
  contents: write

concurrency:
  group: sync-deployed-telegram-ui
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.SB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download active telegram-ui function
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          rm -rf supabase/functions/telegram-ui
          supabase functions download telegram-ui --project-ref dpmohkrwdlicexwcrqfy
          test -s supabase/functions/telegram-ui/index.ts
          test -s supabase/functions/telegram-ui/ui-text-v2.ts

      - name: Commit exact deployed source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-deployed-telegram-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync deployed Telegram UI source"
          git push origin HEAD:main
