name: Sync Auto-Apply v2 registries

on:
  push:
    branches: [auto-apply-v2]
    paths:
      - scripts/sync-auto-apply-v2-registries.mjs
      - .github/workflows/sync-auto-apply-v2-registries.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-apply-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-auto-apply-v2-registries.mjs
      - name: Commit synchronized registries
        run: |
          if git diff --quiet -- supabase/runtime-manifest.json docs/migration-registry.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/runtime-manifest.json docs/migration-registry.json
          git commit -m "Sync Auto-Apply v2 runtime and migration registries"
          git push origin HEAD:auto-apply-v2
