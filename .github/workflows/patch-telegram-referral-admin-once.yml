name: Patch Telegram referral and premium UX once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-telegram-referral-admin-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch Telegram UI
        run: |
