          # Referral/admin UI uses diamond consistently; the exact two-message referral copy keeps its requested gift emoji.
          s = s.replace('`🎁 Erfolgreiche Empfehlungen: ${referralResult.count || 0}\\n`', '`💎 Erfolgreiche Empfehlungen: ${referralResult.count || 0}\\n`')
          s = s.replace('"🎁 <b>Kostenloses Premium aktiviert</b>', '"💎 <b>Kostenloses Premium aktiviert</b>')
          s = s.replace('`🎁 <b>Kostenloses Premium aktiviert</b>', '`💎 <b>Kostenloses Premium aktiviert</b>')

          p.write_text(s)
          PY
          deno check supabase/functions/telegram-ui/index.ts
          grep -q '🔎 ${draftName} • Entwurf' supabase/functions/telegram-ui/index.ts
          grep -q '🔒 ⭐️ Gespeichert' supabase/functions/telegram-ui/index.ts
          grep -q '💎 30 Tage Premium für 0 €' supabase/functions/telegram-ui/index.ts
