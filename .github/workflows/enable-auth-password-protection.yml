name: Enable leaked-password protection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable-auth-password-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Enable and verify leaked-password protection
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dpmohkrwdlicexwcrqfy
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Add a scoped Supabase Management API token as the repository Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          auth_url="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          current="$(curl --fail --silent --show-error "$auth_url" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json")"
          current_value="$(printf '%s' "$current" | jq -r '.password_hibp_enabled // "unknown"')"
          echo "Current password_hibp_enabled: ${current_value}"

          if [[ "$current_value" != "true" ]]; then
            curl --fail --silent --show-error -X PATCH "$auth_url" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"password_hibp_enabled":true}' >/dev/null
          fi

          verified="$(curl --fail --silent --show-error "$auth_url" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" | jq -r '.password_hibp_enabled // "unknown"')"
          if [[ "$verified" != "true" ]]; then
            echo "::error::Supabase did not confirm password_hibp_enabled=true."
            exit 1
          fi
          echo "Verified: leaked-password protection is enabled."
