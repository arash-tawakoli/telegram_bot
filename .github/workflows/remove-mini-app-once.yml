name: Remove Mini App once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-mini-app-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Mini App references and files
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new))

          replace_exact(
              "supabase/functions/telegram-ui/index.ts",
              ",MINI_APP_URL=`${URL}/functions/v1/mini-app`,TYPES=",
              ",TYPES=",
          )
          replace_exact(
              "supabase/functions/telegram-ui/index.ts",
              'r.push([{text:"📱 Wohnungssuche öffnen",web_app:{url:MINI_APP_URL}}]);',
              "",
          )
          replace_exact(
              "supabase/functions/telegram-gateway/index.ts",
              'const MINI_APP_URL = "https://traumwohnung-mini-app.vercel.app";\n',
              "",
          )
          replace_exact(
              "supabase/functions/telegram-gateway/index.ts",
              '''      menu_button: {
                  type: "web_app",
                  text: "Wohnungssuche",
                  web_app: { url: MINI_APP_URL },
                },''',
              '      menu_button: { type: "commands" },',
          )
          replace_exact(
              "supabase/config.toml",
              '\n[functions.mini-app]\nverify_jwt = false\n',
              '\n',
          )

          release = Path("docs/product-releases-2026-09-01.md")
          text = release.read_text()
          for line in [
              '- `mini-app`: Telegram `initData` verification and the Mini App JSON API.\n',
              '- Mini App frontend: `https://traumwohnung-mini-app.vercel.app`.\n',
              '- Vercel Mini App HTML and JavaScript return HTTP 200 with CSP headers.\n',
              '- Invalid Telegram Mini App authentication returns HTTP 401.\n',
              '- A correctly signed current Telegram `initData` bootstrap returns HTTP 200.\n',
          ]:
              text = text.replace(line, "")
          text = text.replace(
              '- Telegram global menu button points to the Vercel Mini App.\n',
              '- Telegram navigation uses the native slash-command menu.\n',
          )
          release.write_text(text)
          PY

          rm -rf supabase/functions/mini-app supabase/static/mini-app

      - name: Verify focused cleanup
        run: |
          set -eu
          test ! -d supabase/functions/mini-app
          test ! -d supabase/static/mini-app
          ! grep -RInE '(MINI_APP_URL|functions/v1/mini-app|traumwohnung-mini-app\.vercel\.app|web_app)' \
            supabase/functions/telegram-ui supabase/functions/telegram-gateway docs/product-releases-2026-09-01.md supabase/config.toml

      - name: Commit cleanup
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Mini App and restore command menu"
          git push
