name: Fix Premium button once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-premium-button-once.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Premium preview transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/telegram-ui/index.ts')
          s=p.read_text()
          old='''async function sendPremiumPreview(chatId: number, caption: string, replyMarkup: any) {\n  const token = await secret("telegram_bot_token_runtime");\n  const raw = atob(PREMIUM_PREVIEW_B64);\n  const bytes = new Uint8Array(raw.length);\n  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);\n  const language = chatLanguages.get(chatId);\n  const form = new FormData();\n  form.set("chat_id", String(chatId));\n  form.set("photo", new Blob([bytes], { type: "image/jpeg" }), "premium.jpg");\n  form.set("caption", localizeText(caption, language));\n  form.set("parse_mode", "HTML");\n  form.set("reply_markup", JSON.stringify(localizeMarkup(replyMarkup, language)));\n  const response = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: "POST", body: form });\n  const result = await response.json().catch(() => ({}));\n  if (!response.ok || !result.ok) throw new Error(String(result?.description || `Telegram ${response.status}`));\n  return result.result;\n}\n'''
          new='''async function sendPremiumPreview(chatId: number, caption: string, replyMarkup: any) {\n  const language = chatLanguages.get(chatId);\n  return telegram("sendPhoto", {\n    chat_id: chatId,\n    photo: `${SUPABASE_URL}/functions/v1/telegram-ui?asset=premium`,\n    caption: localizeText(caption, language),\n    parse_mode: "HTML",\n    reply_markup: localizeMarkup(replyMarkup, language),\n  });\n}\n'''
          if s.count(old) != 1: raise SystemExit(f'preview block matches: {s.count(old)}')
          s=s.replace(old,new,1)
          old2='''Deno.serve(async (request: Request) => {\n  try {\n    if (request.method !== "POST") {\n      return new Response("method not allowed", { status: 405 });\n    }\n'''
          new2='''Deno.serve(async (request: Request) => {\n  try {\n    if (request.method === "GET" || request.method === "HEAD") {\n      const url = new URL(request.url);\n      if (url.searchParams.get("asset") === "premium") {\n        const raw = atob(PREMIUM_PREVIEW_B64);\n        const bytes = new Uint8Array(raw.length);\n        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);\n        return new Response(request.method === "HEAD" ? null : bytes, {\n          headers: {\n            "content-type": "image/jpeg",\n            "cache-control": "public, max-age=31536000, immutable",\n            "x-content-type-options": "nosniff",\n          },\n        });\n      }\n    }\n    if (request.method !== "POST") {\n      return new Response("method not allowed", { status: 405 });\n    }\n'''
          if s.count(old2) != 1: raise SystemExit(f'serve block matches: {s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          grep -F 'photo: `${SUPABASE_URL}/functions/v1/telegram-ui?asset=premium`' supabase/functions/telegram-ui/index.ts
          grep -F 'url.searchParams.get("asset") === "premium"' supabase/functions/telegram-ui/index.ts
          if grep -F 'new FormData()' supabase/functions/telegram-ui/index.ts; then exit 1; fi
          git diff --check
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-premium-button-once.yml
          git add supabase/functions/telegram-ui/index.ts
          git commit -m "Fix Premium preview button"
          git push origin main
