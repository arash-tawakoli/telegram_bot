name: Finalize command handler syntax checks

on:
  push:
    branches:
      - fix/commands-referral-partner-removal
    paths:
      - .github/workflows/one-time-commands-referral-syntax-v4.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow syntax fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ui = Path('supabase/functions/telegram-ui/index.ts')
          text = ui.read_text()
          text, app_count = re.subn(r'send\(c,"📱 <b>Traumwohnung Mini-App</b>\s*Öffne Suche, neue Angebote, Cockpit und Einstellungen in einer Ansicht\.",\{', r'send(c,`📱 <b>Traumwohnung Mini-App</b>\n\nÖffne Suche, neue Angebote, Cockpit und Einstellungen in einer Ansicht.`,{', text, count=1)
          text, rmm_count = re.subn(r'rmm\(u,s\)', 'rmm(u)', text, count=1)
          if app_count != 1 or rmm_count != 1:
              raise SystemExit(f'UI replacement counts: app={app_count}, rmm={rmm_count}')
          ui.write_text(text)

          gateway = Path('supabase/functions/telegram-gateway/index.ts')
          text = gateway.read_text()
          text, gateway_count = re.subn(r'text: "📋 <b>Bot-Menü</b>\s*Die Befehle sind wieder im Telegram-Menü hinterlegt\. Die Mini-App bleibt über /app und den Button unten erreichbar\.",', r'text: `📋 <b>Bot-Menü</b>\n\nDie Befehle sind wieder im Telegram-Menü hinterlegt. Die Mini-App bleibt über /app und den Button unten erreichbar.`,', text, count=1)
          if gateway_count != 1:
              raise SystemExit(f'Gateway replacement count: {gateway_count}')
          gateway.write_text(text)
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          set -eu
          deno check supabase/functions/telegram-ui/index.ts
          deno check supabase/functions/telegram-gateway/index.ts
          deno check supabase/functions/mini-app/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
      - name: Check static Mini App JavaScript
        run: node --check supabase/static/mini-app/app.js
      - name: Commit fixes and remove one-time workflows
        run: |
          set -eu
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-check.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-syntax.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-syntax-v2.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-syntax-v3.yml
          git rm --ignore-unmatch .github/workflows/one-time-commands-referral-syntax-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix command handler syntax"
          git push origin HEAD
