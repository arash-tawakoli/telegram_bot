name: Kleinanzeigen APK Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/analyze_kleinanzeigen_apk.py
      - scripts/download_kleinanzeigen_apkm.mjs
      - .github/workflows/kleinanzeigen-apk-analysis.yml

permissions:
  contents: read

env:
  KA_ANALYSIS_DIR: tmp/ka-analysis

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Try lightweight APKMirror download
        id: lightweight
        continue-on-error: true
        run: python scripts/analyze_kleinanzeigen_apk.py

      - name: Install Playwright fallback
        if: steps.lightweight.outcome != 'success'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download APK bundle through rendered APKMirror flow
        if: steps.lightweight.outcome != 'success'
        run: node scripts/download_kleinanzeigen_apkm.mjs

      - name: Scan downloaded APK bundle
        if: steps.lightweight.outcome != 'success'
        env:
          KA_BUNDLE_PATH: tmp/ka-analysis/kleinanzeigen-2026.37.1.apkm
        run: python scripts/analyze_kleinanzeigen_apk.py

      - name: Upload base APK and raw scan
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kleinanzeigen-2026.37.1-base-and-scan
          path: |
            tmp/ka-analysis/base.apk
            tmp/ka-analysis/analysis.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Confirm analysis
        if: success()
        run: |
          test -s tmp/ka-analysis/base.apk
          test -s tmp/ka-analysis/analysis.txt
          sha256sum tmp/ka-analysis/base.apk
          grep -n -i -E 'user-contactdetails|real-estate-seeker-profile|create-conversation|messagebox/api/users' tmp/ka-analysis/analysis.txt | head -n 80 || true
