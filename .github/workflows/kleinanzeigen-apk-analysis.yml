name: Kleinanzeigen APK Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/analyze_kleinanzeigen_apk.py
      - scripts/download_kleinanzeigen_apkm.mjs
      - .github/workflows/kleinanzeigen-apk-analysis.yml

permissions:
  contents: read

env:
  KA_ANALYSIS_DIR: tmp/ka-analysis

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Try lightweight APKMirror download
        id: lightweight
        continue-on-error: true
        run: python scripts/analyze_kleinanzeigen_apk.py

      - name: Install Playwright fallback
        if: steps.lightweight.outcome != 'success'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download APK bundle through rendered APKMirror flow
        if: steps.lightweight.outcome != 'success'
        run: node scripts/download_kleinanzeigen_apkm.mjs

      - name: Scan downloaded APK bundle
        if: steps.lightweight.outcome != 'success'
        env:
          KA_BUNDLE_PATH: tmp/ka-analysis/kleinanzeigen-2026.37.1.apkm
        run: python scripts/analyze_kleinanzeigen_apk.py

      - name: Decompile first-contact contract classes with JADX
        if: success()
        continue-on-error: true
        run: |
          set -e
          mkdir -p tmp/jadx-bin tmp/ka-analysis/relevant
          URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("jadx-[0-9.]+\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$URL"
          curl -fL "$URL" -o tmp/jadx.zip
          unzip -q tmp/jadx.zip -d tmp/jadx-bin
          for CLASS in \
            ebk.data.entities.models.ReplyToSellerDetailsPayloadSerializer \
            ebk.data.entities.models.messagebox.C25250d2 \
            ebk.data.entities.models.messagebox.C25313p2 \
            ebk.data.remote.api_commands.InterfaceC26803t0 \
            ebk.data.remote.api_commands.InterfaceC26806u0; do
            SAFE="$(printf '%s' "$CLASS" | tr '.' '_')"
            timeout 120 tmp/jadx-bin/bin/jadx --no-res --single-class "$CLASS" --single-class-output "tmp/ka-analysis/relevant/${SAFE}.java" tmp/ka-analysis/base.apk || true
          done

      - name: Collect targeted First Contact source
        if: always()
        run: |
          set -e
          mkdir -p tmp/ka-analysis/relevant
          : > tmp/ka-analysis/relevant_files.txt
          find tmp/ka-analysis/relevant -type f -name '*.java' -print | sort > tmp/ka-analysis/relevant_files.txt || true
          grep -RInE 'contactFields|contact-fields|message|adId|ReplyToSellerDetails|PayloadSerializer|dmh_source|coming_from|conversations|warnPhoneNumber|warnEmail|warnBankDetails' tmp/ka-analysis/relevant > tmp/ka-analysis/jadx_hits_top.txt || true
          tar -czf tmp/ka-analysis/relevant-sources.tgz -C tmp/ka-analysis/relevant . || true
          echo '--- targeted source files ---'
          cat tmp/ka-analysis/relevant_files.txt || true
          echo '--- targeted source ---'
          cat tmp/ka-analysis/relevant/*.java || true

      - name: Upload targeted reverse engineering result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kleinanzeigen-2026.37.1-targeted-source
          path: |
            tmp/ka-analysis/analysis.txt
            tmp/ka-analysis/jadx_hits_top.txt
            tmp/ka-analysis/relevant_files.txt
            tmp/ka-analysis/relevant-sources.tgz
          if-no-files-found: warn
          retention-days: 2
