name: Kleinanzeigen APK Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/analyze_kleinanzeigen_apk.py
      - scripts/download_kleinanzeigen_apkm.mjs
      - .github/workflows/kleinanzeigen-apk-analysis.yml

permissions:
  contents: read

env:
  KA_ANALYSIS_DIR: tmp/ka-analysis

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Try lightweight APKMirror download
        id: lightweight
        continue-on-error: true
        run: python scripts/analyze_kleinanzeigen_apk.py

      - name: Install Playwright fallback
        if: steps.lightweight.outcome != 'success'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download APK bundle through rendered APKMirror flow
        if: steps.lightweight.outcome != 'success'
        run: node scripts/download_kleinanzeigen_apkm.mjs

      - name: Scan downloaded APK bundle
        if: steps.lightweight.outcome != 'success'
        env:
          KA_BUNDLE_PATH: tmp/ka-analysis/kleinanzeigen-2026.37.1.apkm
        run: python scripts/analyze_kleinanzeigen_apk.py

      - name: Decompile base APK with JADX
        if: success()
        continue-on-error: true
        run: |
          set -e
          mkdir -p tmp/jadx-bin tmp/ka-analysis/jadx
          URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("jadx-[0-9.]+\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$URL"
          curl -fL "$URL" -o tmp/jadx.zip
          unzip -q tmp/jadx.zip -d tmp/jadx-bin
          timeout 420 tmp/jadx-bin/bin/jadx --no-res --threads-count 4 -d tmp/ka-analysis/jadx tmp/ka-analysis/base.apk || true

      - name: Collect targeted First Contact source
        if: always()
        run: |
          set -e
          mkdir -p tmp/ka-analysis/relevant
          PATTERN='user-contactdetails|real-estate-seeker-profile|create-conversation|messagebox/api/users|warnPhoneNumber|contentWarnings|contactName|contact-form|seeker-profile|request.?quality|anfrage|isRequired|contactFields|ReplyToSellerDetails|PayloadSerializer'
          if [ -d tmp/ka-analysis/jadx/sources ]; then
            grep -RInE "$PATTERN" tmp/ka-analysis/jadx/sources > tmp/ka-analysis/jadx_hits.txt || true
            grep -RIlE "$PATTERN" tmp/ka-analysis/jadx/sources > tmp/ka-analysis/relevant_files.txt || true
            find tmp/ka-analysis/jadx/sources/ebk/data/entities/models -type f \( -iname '*Serializer*.java' -o -iname '*Payload*.java' \) >> tmp/ka-analysis/relevant_files.txt 2>/dev/null || true
            sort -u tmp/ka-analysis/relevant_files.txt -o tmp/ka-analysis/relevant_files.txt
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              rel="${f#tmp/ka-analysis/jadx/sources/}"
              mkdir -p "tmp/ka-analysis/relevant/$(dirname "$rel")"
              cp "$f" "tmp/ka-analysis/relevant/$rel"
            done < tmp/ka-analysis/relevant_files.txt
          else
            : > tmp/ka-analysis/jadx_hits.txt
            : > tmp/ka-analysis/relevant_files.txt
          fi
          head -n 5000 tmp/ka-analysis/jadx_hits.txt > tmp/ka-analysis/jadx_hits_top.txt || true
          tar -czf tmp/ka-analysis/relevant-sources.tgz -C tmp/ka-analysis/relevant . || true
          echo '--- targeted source files ---'
          cat tmp/ka-analysis/relevant_files.txt || true
          echo '--- targeted hits ---'
          head -n 240 tmp/ka-analysis/jadx_hits_top.txt || true

      - name: Upload targeted reverse engineering result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kleinanzeigen-2026.37.1-targeted-source
          path: |
            tmp/ka-analysis/analysis.txt
            tmp/ka-analysis/jadx_hits_top.txt
            tmp/ka-analysis/relevant_files.txt
            tmp/ka-analysis/relevant-sources.tgz
          if-no-files-found: warn
          retention-days: 2
