name: Remove obsolete referral renewal once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-obsolete-referral-renewal-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete Stripe referral renewal branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/stripe-webhook/index.ts')
          text = path.read_text()
          old = '''    } else if (\n      eventType === "invoice.paid" &&\n      String(object.billing_reason || "") === "subscription_cycle"\n    ) {\n      const customerId = stripeId(object.customer);\n      const subscription = await existingSubscription(undefined, undefined, customerId);\n      if (subscription) await qualifyReferral(String(subscription.user_id));\n    } else if (eventType === "invoice.payment_failed") {\n'''
          new = '''    } else if (eventType === "invoice.payment_failed") {\n'''
          if text.count(old) != 1:
              raise SystemExit('expected obsolete invoice.paid referral branch exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

          if grep -q 'eventType === "invoice.paid"' supabase/functions/stripe-webhook/index.ts; then
            echo 'obsolete invoice.paid branch still present' >&2
            exit 1
          fi
          grep -q 'eventType === "invoice.payment_failed"' supabase/functions/stripe-webhook/index.ts
          git diff --check

          rm -f .github/workflows/remove-obsolete-referral-renewal-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/stripe-webhook/index.ts .github/workflows/remove-obsolete-referral-renewal-once.yml
          git commit -m "Remove obsolete referral renewal hook"
          git push origin HEAD:main
