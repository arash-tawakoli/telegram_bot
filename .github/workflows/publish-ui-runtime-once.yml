name: Publish exact UI runtime once
on:
  push:
    paths:
      - '.github/workflows/publish-ui-runtime-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact runtime
        run: |
          npx --yes esbuild@0.25.9 supabase/functions/telegram-ui/index.ts --bundle --platform=neutral --format=esm --target=es2022 --external:jsr:* --external:npm:* --outfile=supabase/deployed-support/telegram-ui-runtime-once.ts
          if grep -Eqi 'bewerbermappe|dossier|applicant_profile|application_documents|application-documents|dossier_input|/mappe|purgeApplicantDocuments' supabase/deployed-support/telegram-ui-runtime-once.ts; then
            echo 'Former feature reference found in runtime' >&2
            exit 1
          fi
      - name: Commit runtime and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-ui-runtime-once.yml
          git add supabase/deployed-support/telegram-ui-runtime-once.ts
          git commit -m 'Stage exact UI runtime for deployment'
          git push
