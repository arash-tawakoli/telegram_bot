name: Deploy Telegram Gateway

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/telegram-gateway/**'
      - '.github/workflows/deploy-telegram-gateway.yml'

permissions:
  contents: read

concurrency:
  group: deploy-telegram-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy telegram-gateway
        run: supabase functions deploy telegram-gateway --project-ref dpmohkrwdlicexwcrqfy --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
