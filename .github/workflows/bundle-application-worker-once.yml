name: Bundle clean application-worker once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bundle-application-worker-once.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle exact clean worker
        run: |
          npx --yes esbuild@0.25.9 supabase/functions/application-worker/index.ts \
            --bundle --format=esm --platform=neutral --target=es2022 --minify \
            '--external:npm:*' '--external:jsr:*' \
            --outfile=application-worker-clean/index.ts
          if grep -RniE 'Bewerbungsmappe|Bewerbermappe|dossier|applicant_profile|application_documents|application-documents|dossier_input' application-worker-clean; then
            echo 'Forbidden feature reference found in bundle' >&2
            exit 9
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: application-worker-clean-bundle
          path: application-worker-clean/index.ts
          retention-days: 1
      - name: Self-clean
        if: always()
        run: |
          git rm .github/workflows/bundle-application-worker-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time application-worker bundler'
          git push