name: One-time auto-apply runtime sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-auto-apply-runtime-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync runtime manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const path='supabase/runtime-manifest.json';
          const runtime=JSON.parse(fs.readFileSync(path,'utf8'));
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const sync=(slug,version,paths)=>{
            const fn=runtime.functions.find(x=>x.slug===slug);
            if(!fn)throw new Error(`missing function ${slug}`);
            fn.version=version;
            fn.files=paths.map(p=>({path:p,sha256:hash(p),deployed_sha256:hash(p)}));
            fn.entrypoint=paths[0];
          };
          const app=runtime.functions.find(x=>x.slug==='application-worker');
          sync('application-worker',40,app.files.map(x=>x.path));
          sync('telegram-fast',9,['supabase/functions/telegram-fast/index.ts']);
          sync('telegram-gateway',31,['supabase/functions/telegram-gateway/index.ts','supabase/functions/telegram-gateway/auto-apply.ts']);
          runtime.observed_at='2026-09-15';
          fs.writeFileSync(path,JSON.stringify(runtime,null,2)+'\n');
          NODE
          rm .github/workflows/one-time-auto-apply-runtime-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/runtime-manifest.json .github/workflows/one-time-auto-apply-runtime-sync.yml
          git commit -m "Sync auto-apply runtime manifest"
          git push
