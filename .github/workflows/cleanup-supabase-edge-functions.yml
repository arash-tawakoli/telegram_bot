name: Cleanup legacy Supabase edge functions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-supabase-edge-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dpmohkrwdlicexwcrqfy
    steps:
      - name: Require Supabase management token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Delete legacy Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            telegram-webhook
            source-engine
            source-immowelt
            source-kleinanzeigen
            source-immoscout
            source-immoscout-mcp-probe
            source-immomio
            source-job-runner
            listing-enricher
            telegram-ui-v3
            source-fwheg
            source-immosolve-hpm
            source-bve
            source-offer-page
            source-immoscout-html-test
            kleinanzeigen-inventory-poc
            kleinanzeigen-inventory-partitioned-poc
            kleinanzeigen-final-audit
            kleinanzeigen-html-diagnostic
            kleinanzeigen-sort-probe
            kleinanzeigen-district-audit
            kleinanzeigen-district-date-audit
            kleinanzeigen-page-id-probe
            immowelt-html-diagnostic
            immowelt-js-diagnostic
            immowelt-inventory-audit
            immowelt-count-probe
            immowelt-chunk-scan
            immowelt-init-extractor
            immowelt-init-public-audit
            immowelt-html-context-public-audit
            immowelt-bff-public-audit
            immowelt-sort-link-audit
            immowelt-ssr-state-audit
            immowelt-filter-context-public-audit
            immowelt-query-variant-audit
            immowelt-final-pagination-test
            scheduler-recovery-20260829
            source-immoscout-fast
            kleinanzeigen-probe
            source-kleinanzeigen-fast
            source-kleinanzeigen-rolling
            source-immoscout-rolling
            coverage-acceptance-test
            noop-placeholder-test-should-not-deploy
            source-worker-v3
          )

          for fn in "${functions[@]}"; do
            response_file="$(mktemp)"
            status="$(curl -sS -o "$response_file" -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/functions/${fn}")"
            if [ "$status" = "200" ] || [ "$status" = "404" ]; then
              echo "Removed ${fn} (${status})"
            else
              echo "::error::Failed to remove ${fn}; HTTP ${status}."
              cat "$response_file"
              exit 1
            fi
            rm -f "$response_file"
          done

      - name: Verify canonical function set
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/functions" \
            | jq -r '.[].slug' | sort)"
          expected="$(printf '%s\n' \
            kleinanzeigen-transport \
            notification-dispatcher \
            source-worker \
            telegram-fallback-logo \
            telegram-ui \
            | sort)"

          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected Edge Function set after cleanup."
            echo "Actual:"
            printf '%s\n' "$actual"
            echo "Expected:"
            printf '%s\n' "$expected"
            exit 1
          fi

          echo "Supabase Edge Function cleanup verified: exactly 5 canonical functions remain."
