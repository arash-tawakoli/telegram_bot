name: Prepare durable Telegram UI source once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/slim-telegram-ui-source-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Remove embedded Premium image and use image function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('supabase/functions/telegram-ui/index.ts')
          s = p.read_text()
          s, n = re.subn(r'const PREMIUM_PREVIEW_B64 = \[.*?\]\.join\(""\);', 'const PREMIUM_PREVIEW_B64 = "";', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('premium image payload anchor missing')
          old = '''function premiumPreviewUrl() {
            return `${SUPABASE_URL}/functions/v1/telegram-ui?asset=premium&v=20260903hd`;
          }'''
          new = '''function premiumPreviewUrl() {
            return `${SUPABASE_URL}/functions/v1/telegram-premium-image?v=20260903hd2`;
          }'''
          if old not in s:
              raise SystemExit('premium preview url anchor missing')
          s = s.replace(old, new, 1)
          old_asset = '''      if (url.searchParams.get("asset") === "premium") {
                const raw = atob(PREMIUM_PREVIEW_B64);
                const bytes = new Uint8Array(raw.length);
                for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
                return new Response(request.method === "HEAD" ? null : bytes, {
                  headers: {
                    "content-type": "image/jpeg",
                    "cache-control": "public, max-age=31536000, immutable",
                    "x-content-type-options": "nosniff",
                  },
                });
              }'''
          new_asset = '''      if (url.searchParams.get("asset") === "premium") {
                return fetch(`${SUPABASE_URL}/functions/v1/telegram-premium-image?v=20260903hd2`, {
                  method: request.method,
                });
              }'''
          if old_asset not in s:
              raise SystemExit('premium asset route anchor missing')
          s = s.replace(old_asset, new_asset, 1)
          p.write_text(s)
          PY
          deno check supabase/functions/telegram-ui/index.ts
          grep -q '🎁 30 Tage Premium für 0 €' supabase/functions/telegram-ui/index.ts
          grep -q '414638980' supabase/functions/telegram-ui/index.ts
          grep -q 'admin:delete-confirm:' supabase/functions/telegram-ui/index.ts
          grep -q '✖️ Abbrechen' supabase/functions/telegram-ui/index.ts
          grep -q 'telegram-premium-image?v=20260903hd2' supabase/functions/telegram-ui/index.ts
      - name: Commit source cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/telegram-ui/index.ts
          git commit -m 'Use durable Premium image endpoint'
          git push
