name: Runtime Snapshot Restore Smoke Test

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'docs/migration-registry.d/**'
      - 'scripts/check-runtime.mjs'
      - '.github/workflows/runtime-restore-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'docs/migration-registry.d/**'
      - 'scripts/check-runtime.mjs'
      - '.github/workflows/runtime-restore-smoke.yml'

permissions:
  contents: read

jobs:
  clean-room-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start -x studio,imgproxy,vector
      - name: Replay all migrations from an empty local database
        run: supabase db reset --local
      - name: Validate migration registry and runtime archive
        env:
          RUNTIME_HASH_STRICT: '1'
        run: node scripts/check-runtime.mjs
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
